name: Held live scalar diagnostic profile
# Source-only template. The job stays disabled until root/source review and a
# separate owner allocation; enabling/installing requires a new reviewed seal.
on:
  workflow_dispatch:
    inputs:
      packet_seal_sha256:
        description: Reviewed diagnostic packet seal
        required: true
        type: string
      admission_json:
        description: Exact owner admission JSON, including accepted historical prerequisites
        required: true
        type: string
      admission_sha256:
        description: SHA256 of admission_json UTF-8, without appended newline
        required: true
        type: string
permissions:
  contents: read
jobs:
  profile:
    if: ${{ false }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PACKET_SEAL_SHA256: ${{ inputs.packet_seal_sha256 }}
      ROOT_ADMISSION_JSON: ${{ inputs.admission_json }}
      ROOT_ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
    steps:
      - name: Fetch reviewed diagnostic tools into a new localdev root
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-live-scalar-profile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Bind owner admission without shell interpretation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=os.environ['ROOT_ADMISSION_JSON'].encode('utf-8')
          assert len(raw)<=32768
          assert hashlib.sha256(raw).hexdigest()==os.environ['ROOT_ADMISSION_SHA256']
          json.loads(raw)
          with (Path(os.environ['TASK_ROOT'])/'ADMISSION.json').open('xb') as f:f.write(raw)
          PY
      - name: Build fresh instrumented B then run the fixed diagnostic and calibration sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$TASK_ROOT/tools/Scripts/live-scalar-profile-96-d1/run-profile.py" \
            --root "$TASK_ROOT" --seal-sha256 "$PACKET_SEAL_SHA256" \
            --admission-json "$TASK_ROOT/ADMISSION.json" --admission-sha256 "$ROOT_ADMISSION_SHA256"
      - name: Preserve diagnostic inputs outputs and first failure
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: live-scalar-profile-96-d1-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/receipts
            ${{ env.TASK_ROOT }}/runs
            ${{ env.TASK_ROOT }}/test-logs
            ${{ env.TASK_ROOT }}/ADMISSION.json
            ${{ env.TASK_ROOT }}/tools/Scripts/live-scalar-profile-96-d1
            ${{ env.TASK_ROOT }}/candidate/lattice/Tests/CLatticeTestSQLite
            ${{ env.TASK_ROOT }}/candidate/lattice/Tests/LatticeTests/PerfRefinementBenchmarks.swift
            ${{ env.TASK_ROOT }}/candidate/LatticeCore/Sources/LatticeCore/src/db.cpp
            ${{ env.TASK_ROOT }}/candidate/LatticeCore/Sources/LatticeCore/src/perf_live_profile.hpp
            ${{ env.TASK_ROOT }}/candidate/LatticeCore/Sources/LatticeCore/include/lattice/perf_live_profile.h
            ${{ env.TASK_ROOT }}/candidate/scratch/**/release/LatticeCore.build
            ${{ env.TASK_ROOT }}/candidate/scratch/**/release/LatticeSwiftCppBridge.build
            ${{ env.TASK_ROOT }}/candidate/scratch/**/release/Lattice.build
            ${{ env.TASK_ROOT }}/candidate/scratch/**/release/LatticeTests.build
            ${{ env.TASK_ROOT }}/candidate/scratch/**/*.xctest/**
            ${{ env.TASK_ROOT }}/candidate/scratch/**/*.a
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
