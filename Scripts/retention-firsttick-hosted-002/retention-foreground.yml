name: Held retention first-tick and manual-drain comparison
# Reuses the registered filename. No automatic push trigger or duplicate run.
on:
  workflow_dispatch:
    inputs:
      packet_seal_sha256:
        description: Reviewed hosted retention packet seal
        required: true
        type: string
      admission_json:
        description: Exact root-approved one-run admission JSON
        required: true
        type: string
      admission_sha256:
        description: SHA256 of admission_json UTF-8 bytes without appended newline
        required: true
        type: string
permissions:
  contents: read
jobs:
  same-allocation:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RETENTION_PACKET_SEAL_SHA256: ${{ inputs.packet_seal_sha256 }}
      ROOT_ADMISSION_JSON: ${{ inputs.admission_json }}
      RETENTION_ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
    steps:
      - name: Start one aggregate clock and fetch the reviewed tools
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          TASK_ROOT="$HOME/localdev/lattice-retention-firsttick-${GITHUB_RUN_ID}-1"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          echo "RETENTION_HOSTED_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TASK_ROOT TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          python3 -B - <<'PY'
          import datetime,hashlib,json,os,time
          from pathlib import Path
          root=Path(os.environ['TASK_ROOT'])
          raw=os.environ['ROOT_ADMISSION_JSON'].encode('utf-8')
          assert len(raw)<=32768 and hashlib.sha256(raw).hexdigest()==os.environ['RETENTION_ADMISSION_SHA256']
          with (root/'BOOTSTRAP.json').open('x') as f:
              json.dump({'root':str(root),'startedMonotonic':time.monotonic(),
                'startedUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                'bootID':Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
                'hosted':{'runID':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'workflowCommit':os.environ['GITHUB_SHA'],'repository':os.environ['GITHUB_REPOSITORY']}},f)
          with (root/'ADMISSION.json').open('xb') as f:f.write(raw)
          PY
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir "$TASK_ROOT/packet"
          git -C "$TASK_ROOT/tools" archive FETCH_HEAD Scripts/retention-firsttick-hosted-002 | tar -x -C "$TASK_ROOT/packet" --strip-components=2
      - name: Authenticate and create both fresh source packets
        timeout-minutes: 2
        run: python3 -B "$TASK_ROOT/packet/hosted.py" init
      - name: Install the original explicit compiler and platform SQLite inputs
        timeout-minutes: 6
        run: python3 -B "$TASK_ROOT/packet/hosted.py" toolchain
      - name: Fetch baseline d546 objects
        timeout-minutes: 3
        run: python3 -B "$TASK_ROOT/packet/hosted.py" baseline-fetch
      - name: Prepare exact baseline sources
        timeout-minutes: 26
        run: python3 -B "$TASK_ROOT/baseline/harness/run.py" prepare --core-source "$TASK_ROOT/objects/baseline"
      - name: Build fresh baseline at uniform O3 and one job
        timeout-minutes: 26
        run: |
          python3 -B "$TASK_ROOT/baseline/harness/run.py" build \
            --c-compiler /usr/bin/clang-18 --cxx-compiler /usr/bin/clang++-18 \
            --sqlite-include /usr/include --sqlite-library /usr/lib/x86_64-linux-gnu/libsqlite3.so
      - name: Collect baseline first tick and manual drain protocol
        timeout-minutes: 61
        run: python3 -B "$TASK_ROOT/baseline/harness/run.py" run
      - name: Fetch bounded beee objects after baseline success
        timeout-minutes: 3
        run: python3 -B "$TASK_ROOT/packet/hosted.py" bounded-fetch
      - name: Prepare exact bounded sources
        timeout-minutes: 26
        run: python3 -B "$TASK_ROOT/bounded/harness/run.py" prepare --core-source "$TASK_ROOT/objects/bounded"
      - name: Build fresh bounded at uniform O3 and one job
        timeout-minutes: 26
        run: |
          python3 -B "$TASK_ROOT/bounded/harness/run.py" build \
            --c-compiler /usr/bin/clang-18 --cxx-compiler /usr/bin/clang++-18 \
            --sqlite-include /usr/include --sqlite-library /usr/lib/x86_64-linux-gnu/libsqlite3.so
      - name: Collect bounded first tick and manual drain protocol
        timeout-minutes: 61
        run: python3 -B "$TASK_ROOT/bounded/harness/run.py" run
      - name: Bind both completed results without granting performance acceptance
        timeout-minutes: 2
        run: python3 -B "$TASK_ROOT/packet/hosted.py" finalize
      - name: Preserve all first failures and source evidence
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: retention-firsttick-drain-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/BOOTSTRAP.json
            ${{ env.TASK_ROOT }}/ADMISSION.json
            ${{ env.TASK_ROOT }}/INITIALIZED.json
            ${{ env.TASK_ROOT }}/TOOLCHAIN-INPUTS.json
            ${{ env.TASK_ROOT }}/COMPARISON-INPUTS.json
            ${{ env.TASK_ROOT }}/packet
            ${{ env.TASK_ROOT }}/hosted-receipts
            ${{ env.TASK_ROOT }}/control
            ${{ env.TASK_ROOT }}/baseline
            ${{ env.TASK_ROOT }}/bounded
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
