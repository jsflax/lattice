name: Cold keeper constructor phase diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-macos:
    runs-on: macos-14
    timeout-minutes: 85
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact tools into owned localdev root
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/cold-constructor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp" "$TASK_ROOT/packet"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" archive FETCH_HEAD Scripts/cold-constructor-diagnostic | tar -x -C "$TASK_ROOT/packet" --strip-components=2
          export TASK_ROOT
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['TASK_ROOT'])
          tree=subprocess.check_output(['git','-C',str(root/'tools'),'rev-parse','FETCH_HEAD^{tree}'],text=True).strip()
          with(root/'packet/WORKFLOW-SOURCE.json').open('x')as out:
              json.dump({'sha':os.environ['GITHUB_SHA'],'tree':tree,'repository':os.environ['GITHUB_REPOSITORY'],
                         'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']},out,indent=2)
          PY
      - name: Fetch exact Core and materialize authenticated diagnostic overlay
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/packet/fetch-core.py" --root "$TASK_ROOT"
          python3 "$TASK_ROOT/packet/harness/run.py" prepare --repo "$TASK_ROOT/core-objects"
      - name: Configure two fresh uniform optimized arms
        timeout-minutes: 11
        run: python3 "$TASK_ROOT/packet/harness/run.py" configure
      - name: Compile control OFF and prove actual inputs
        timeout-minutes: 23
        run: python3 "$TASK_ROOT/packet/harness/run.py" build-off
      - name: Compile diagnostic ON and prove actual inputs
        timeout-minutes: 23
        run: python3 "$TASK_ROOT/packet/harness/run.py" build-on
      - name: Collect six alternating fresh-path cold and warm samples
        timeout-minutes: 6
        run: python3 "$TASK_ROOT/packet/harness/run.py" run
      - name: Preserve sources, raw timing and all failures
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: cold-constructor-diagnostic-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/packet/*.json
            ${{ env.TASK_ROOT }}/packet/*.md
            ${{ env.TASK_ROOT }}/packet/*.patch
            ${{ env.TASK_ROOT }}/packet/harness
            ${{ env.TASK_ROOT }}/packet/overlay
            ${{ env.TASK_ROOT }}/packet/receipts
            ${{ env.TASK_ROOT }}/packet/fixtures
            ${{ env.TASK_ROOT }}/packet/parser-fixtures
            ${{ env.TASK_ROOT }}/packet/build-*/compile_commands.json
            ${{ env.TASK_ROOT }}/packet/build-*/CMakeCache.txt
            ${{ env.TASK_ROOT }}/packet/build-*/probe.map
            ${{ env.TASK_ROOT }}/packet/build-*/otool.txt
            ${{ env.TASK_ROOT }}/packet/build-*/CMakeFiles/ColdKeeperProbe.dir/link.txt
            ${{ env.TASK_ROOT }}/fetch-receipts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
