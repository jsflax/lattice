name: Owned-page SDK070 qualification
# Root-reviewed one-run qualification; exact admission is required at dispatch.
on:
  workflow_dispatch:
    inputs:
      packet_seal_sha256:
        description: Reviewed hosted009 packet seal
        required: true
        type: string
      admission_json:
        description: Exact one-run owner admission JSON
        required: true
        type: string
      admission_sha256:
        description: SHA256 of admission_json UTF-8 without appended newline
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualification:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PACKET_SEAL_SHA256: ${{ inputs.packet_seal_sha256 }}
      ROOT_ADMISSION_JSON: ${{ inputs.admission_json }}
      ROOT_ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
    steps:
      - name: Fetch reviewed qualification tools into a fresh localdev root
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-owned-page-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TASK_ROOT
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=os.environ['ROOT_ADMISSION_JSON'].encode('utf-8')
          assert len(raw)<=32768 and hashlib.sha256(raw).hexdigest()==os.environ['ROOT_ADMISSION_SHA256']
          json.loads(raw)
          with (Path(os.environ['TASK_ROOT'])/'ADMISSION.json').open('xb') as f:f.write(raw)
          PY
      - name: Run one fresh Debug SDK graph and wait for owner settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$TASK_ROOT/tools/Scripts/owned-page-hosted-009/hosted.py" \
            --root "$TASK_ROOT" --packet-seal-sha256 "$PACKET_SEAL_SHA256" \
            --admission-sha256 "$ROOT_ADMISSION_SHA256"
      - name: Preserve complete bounded qualification evidence and first failure
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: owned-page-sdk070-core919-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/ADMISSION.json
            ${{ env.TASK_ROOT }}/HOSTED-CONTEXT.json
            ${{ env.TASK_ROOT }}/HOSTED-RESULT.json
            ${{ env.TASK_ROOT }}/run
            ${{ env.TASK_ROOT }}/run-owner
            ${{ env.TASK_ROOT }}/tools/Scripts/owned-page-hosted-009
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
