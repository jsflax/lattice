name: Exploratory Release benchmark
# Development evidence only. Existing release/consumer workflows are unchanged.
on:
  push:
    branches: [codex/perf-qualification-20260918]
    paths:
      - "Scripts/remote-benchmark/**"
      - ".github/workflows/release-benchmark.yml"
  workflow_dispatch:
    inputs:
      candidate_sdk_sha:
        description: Exact reviewed SDK commit; must contain the frozen harness
        required: true
        type: string
permissions:
  contents: read
jobs:
  same-allocation:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_SDK_SHA: ${{ inputs.candidate_sdk_sha || 'da396f7715584bbf6ddec2b1d78bc0c69b07e294' }}
    steps:
      - name: Fetch benchmark tools into owned localdev directory
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build Release and measure original A/A then candidate B
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/tools/Scripts/remote-benchmark/run-release-benchmark.py" \
            --root "$TASK_ROOT" --candidate-sdk-sha "$CANDIDATE_SDK_SHA"
      - name: Preserve raw measurements, fixtures, and failed-run evidence
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-release-benchmark-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/receipts
            ${{ env.TASK_ROOT }}/runs
            ${{ env.TASK_ROOT }}/test-logs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
