name: Retention phase and floor diagnostics
# One traced maintenance sample plus independent floor-race controls. No performance acceptance.
on:
  push:
    branches: [codex/perf-qualification-20260918]
    paths: ['.github/workflows/retention-diagnostics.yml', 'Scripts/retention-diagnostics/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch reviewed packet into owned localdev root
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-retention-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
          cp -R "$TASK_ROOT/tools/Scripts/retention-diagnostics" "$TASK_ROOT/packet"
      - name: Install explicit compiler and platform SQLite headers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake make libsqlite3-dev
          test "$(uname -m)" = x86_64
      - name: Fetch authenticated Core objects and export exact reviewed inputs
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/packet/fetch-core.py" --root "$TASK_ROOT"
          python3 "$TASK_ROOT/packet/harness/run.py" prepare --core-source "$TASK_ROOT/core-objects"
      - name: Compile uniform optimized Core and verify object and archive inputs
        id: uniform-build
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/packet/harness/run.py" build \
            --c-compiler /usr/bin/clang-18 --cxx-compiler /usr/bin/clang++-18 \
            --sqlite-include /usr/include --sqlite-library /usr/lib/x86_64-linux-gnu/libsqlite3.so
      - name: Trace one maintenance tick alongside unchanged foreground work
        if: ${{ always() && steps.uniform-build.outcome == 'success' }}
        timeout-minutes: 61
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/packet/harness/run.py" run
      - name: Check late writer floors in four independent retained-history cases
        if: ${{ always() && steps.uniform-build.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/packet/harness/run.py" floor
      - name: Preserve all receipts and failed fixture evidence
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: retention-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/packet/*.json
            ${{ env.TASK_ROOT }}/packet/receipts
            ${{ env.TASK_ROOT }}/packet/fixtures
            ${{ env.TASK_ROOT }}/packet/floor-race-run-001
            ${{ env.TASK_ROOT }}/packet/build/compile_commands.json
            ${{ env.TASK_ROOT }}/packet/build/CMakeCache.txt
            ${{ env.TASK_ROOT }}/packet/build/probe.map
            ${{ env.TASK_ROOT }}/packet/build/floor-race.map
            ${{ env.TASK_ROOT }}/packet/build/CMakeFiles/RetentionFloorRaceProbe.dir/link.txt
            ${{ env.TASK_ROOT }}/packet/build/CMakeFiles/RetentionForegroundProbe.dir/link.txt
            ${{ env.TASK_ROOT }}/fetch-receipts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
