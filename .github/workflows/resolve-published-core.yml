name: Resolve exact published Core for Swift wrapper

on:
  push:
    branches: [codex/cold-vector-wrapper-resolution-20261022]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-wrapper-resolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-published-core:
    runs-on: macos-26
    timeout-minutes: 28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESOLUTION_REPOSITORY: ${{ github.repository }}
      RESOLUTION_WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Fetch exact resolver into actual localdev
        timeout-minutes: 3
        env:
          RESOLUTION_CONTENTS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOOT'
          from pathlib import Path
          import hashlib, json, os, pwd, re, stat, urllib.request
          home=Path(pwd.getpwuid(os.geteuid()).pw_dir)
          if not home.is_absolute() or home!=Path(os.path.normpath(home)) or any(c in str(home) for c in ('\n','\r','\0')):
              raise RuntimeError('actual normalized account home required')
          def secure(path):
              current=Path('/')
              for component in path.parts[1:]:
                  current/=component;s=current.lstat()
                  if not stat.S_ISDIR(s.st_mode) or stat.S_ISLNK(s.st_mode) or s.st_uid not in (0,os.geteuid()) or s.st_mode&0o022:
                      raise RuntimeError('actual account/project ancestor owner/mode differs')
          secure(home)
          repo=os.environ['RESOLUTION_REPOSITORY'];commit=os.environ['RESOLUTION_WORKFLOW_COMMIT']
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          if repo!='jsflax/lattice' or not re.fullmatch('[0-9a-f]{40}',commit) or not run.isdecimal() or not attempt.isdecimal():
              raise RuntimeError('closed actual repository/run identity required')
          localdev=home/'localdev';localdev.mkdir(mode=0o700,exist_ok=True);secure(localdev)
          project=localdev/('lattice-wrapper-resolve-'+run+'-'+attempt)
          project.mkdir(mode=0o700,exist_ok=False);secure(project)
          for name in ('control','evidence','tmp','module-cache','scratch','cache','config','security'):
              (project/name).mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in {'RESOLUTION_PROJECT_ROOT':str(project),'TMPDIR':str(project/'tmp'),'TMP':str(project/'tmp'),
                                'TEMP':str(project/'tmp'),'CLANG_MODULE_CACHE_PATH':str(project/'module-cache'),
                                'SWIFT_MODULECACHE_PATH':str(project/'module-cache'),'SWIFTPM_MODULECACHE_OVERRIDE':str(project/'module-cache')}.items():
                  output.write(key+'='+value+'\n')
          record={'state':'BOOTSTRAPPING_UNQUALIFIED','actualUid':os.geteuid(),'actualHome':str(home),'projectRoot':str(project),
                  'repository':repo,'workflowCommit':commit,'runId':run,'runAttempt':attempt,'controllerIssued':False}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,message,headers,newurl):raise RuntimeError('unexpected contents redirect refused')
          try:
              expected='27eccffabd735d22491db3439e255660fe1348d2a2b3dd12f1244f81992b8e8f'
              url='https://api.github.com/repos/'+repo+'/contents/.github/qualification/resolve_published_core.py?ref='+commit
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['RESOLUTION_CONTENTS_TOKEN'],
                  'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'lattice-wrapper-resolve'})
              with urllib.request.build_opener(NoRedirect).open(request,timeout=45) as response:
                  raw=response.read(128*1024+1)
              if len(raw)>128*1024 or hashlib.sha256(raw).hexdigest()!=expected:
                  raise RuntimeError('bounded exact committed resolver differs')
              path=project/'control/resolve_published_core.py'
              with path.open('xb') as output:
                  os.fchmod(output.fileno(),0o600);output.write(raw)
              record.update(state='EXACT_CONTROLLER_FETCHED_NOT_EXECUTED',controllerSHA256=expected)
              (project/'BOOTSTRAP.json').write_text(json.dumps(record,indent=2)+'\n')
              (project/'evidence/BOOTSTRAP.json').write_bytes((project/'BOOTSTRAP.json').read_bytes())
          except BaseException as error:
              record.update(state='BOOTSTRAP_REFUSAL_NO_CONTROLLER_ISSUED',error=repr(error))
              (project/'evidence/BOOTSTRAP-REFUSAL.json').write_text(json.dumps(record,indent=2)+'\n');raise
          PYBOOT

      - name: Resolve only after actual published Core proof
        timeout-minutes: 21
        working-directory: ${{ env.RESOLUTION_PROJECT_ROOT }}
        env:
          RESOLUTION_CONTENTS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RESOLUTION_PROJECT_ROOT/control/resolve_published_core.py" --project-root "$RESOLUTION_PROJECT_ROOT"

      # Raw failed/unknown output is diagnostic. Only actual controller RESULT
      # correspondence plus real job outcomes can qualify generated lock DATA.
      - name: Preserve original resolution outcomes and generated lock
        if: always() && env.RESOLUTION_PROJECT_ROOT != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: exact-wrapper-core-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESOLUTION_PROJECT_ROOT }}/evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
