name: Docs

# Build the DocC catalog (Sources/Lattice/Lattice.docc) and deploy it to
# GitHub Pages at https://jsflax.github.io/lattice/documentation/lattice/.
# Runs on main pushes that can change the rendered docs (the catalog, doc
# comments in Lattice sources, the manifest) and on demand.
on:
  push:
    branches: [main]
    paths:
      - "Sources/Lattice/**"
      - "Package.swift"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macos-26 matches ci.yml: its default toolchain satisfies
    # swift-tools-version 6.3 with no toolchain-install step.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Fetch exact documentation source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          WRAPPER_DOC_ROOT="$HOME/localdev/lw-docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$WRAPPER_DOC_ROOT"
          mkdir -p "$WRAPPER_DOC_ROOT"/{tmp,swift-cache,swift-config,swift-security,module-cache}
          export TMPDIR="$WRAPPER_DOC_ROOT/tmp" TMP="$WRAPPER_DOC_ROOT/tmp" TEMP="$WRAPPER_DOC_ROOT/tmp"
          {
            echo "WRAPPER_DOC_ROOT=$WRAPPER_DOC_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$WRAPPER_DOC_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$WRAPPER_DOC_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$WRAPPER_DOC_ROOT/module-cache"
          } >> "$GITHUB_ENV"
          git init "$WRAPPER_DOC_ROOT/source"
          git -C "$WRAPPER_DOC_ROOT/source" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$WRAPPER_DOC_ROOT/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$WRAPPER_DOC_ROOT/source" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build DocC archive (static hosting)
        working-directory: ${{ env.WRAPPER_DOC_ROOT }}/source
        run: |
          swift package --scratch-path "$WRAPPER_DOC_ROOT/source/.build" \
            --cache-path "$WRAPPER_DOC_ROOT/swift-cache" --config-path "$WRAPPER_DOC_ROOT/swift-config" \
            --security-path "$WRAPPER_DOC_ROOT/swift-security" \
            --allow-writing-to-directory "$WRAPPER_DOC_ROOT/docs-out" \
            generate-documentation --target Lattice \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path lattice \
            --output-path "$WRAPPER_DOC_ROOT/docs-out"

      # The archive's pages live under /documentation/lattice/; give the
      # site root a redirect so the bare Pages URL lands somewhere useful.
      - name: Add root redirect
        working-directory: ${{ env.WRAPPER_DOC_ROOT }}/source
        run: |
          cat > "$WRAPPER_DOC_ROOT/docs-out/index.html" <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=documentation/lattice/">
              <title>Lattice Documentation</title>
            </head>
            <body>
              <a href="documentation/lattice/">Lattice documentation</a>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WRAPPER_DOC_ROOT }}/docs-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
