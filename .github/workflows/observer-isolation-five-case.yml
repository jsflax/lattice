name: Observer isolation five-case diagnostic

# Diagnostic only. Existing CI, WAL, N30 and full-suite outcomes remain authoritative.
# Publishing this file on the exact branch below starts a cold hosted build.
# ROOT must authorize that publication/event separately from source preparation.
on:
  push:
    branches: [codex/observer-isolation-five-case-20260916]

permissions:
  contents: read

concurrency:
  group: observer-isolation-five-case-20260916
  cancel-in-progress: false

jobs:
  five-case:
    name: Five-case diagnostic (Linux stable; not full qualification)
    if: github.repository == 'jsflax/lattice' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swift@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    defaults:
      run:
        shell: bash
    steps:
      - name: Start bounded diagnostic custody clock
        timeout-minutes: 1
        run: |
          set -eu
          FIVE_CASE_EVIDENCE="$RUNNER_TEMP/observer-isolation-five-case"
          mkdir -m 700 "$FIVE_CASE_EVIDENCE"
          read -r FIVE_CASE_UPTIME _ < /proc/uptime
          printf '%s\n' "$FIVE_CASE_UPTIME" > "$FIVE_CASE_EVIDENCE/clock-start-uptime"
          printf '%s\n' 'Diagnostic only; missing RESULT.json or incomplete artifact custody is NONPASS.' > "$FIVE_CASE_EVIDENCE/SCOPE.txt"

      # The recorded Swift container has no Python. This platform-managed action
      # supplies a prebuilt supervisor; it is not evidence of native phase closure.
      - name: Supply Python supervisor runtime
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
          architecture: x64
          check-latest: false

      - name: Checkout exact published push and its parent
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Materialize containment.py part 1
        timeout-minutes: 1
        run: |
          set -eu
          FIVE_CASE_PROGRAM="$RUNNER_TEMP/observer-isolation-five-case/program"
          mkdir -p "$FIVE_CASE_PROGRAM"
          cat > "$FIVE_CASE_PROGRAM/containment.py" <<'FIVE_CASE_CONTAINMENT_PY_1'
          """Linux phase containment for a dedicated, sequential hosted Python runner.
          
          Production entry point: run_phase(). No runtime setup happens at import.
          The caller reserves 20 seconds AFTER each supplied monotonic work deadline.
          Kernel/filesystem calls are not claimed to be forcibly interruptible by Python.
          """
          import ctypes
          import errno
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import shutil
          import signal
          import subprocess
          import sys
          import threading
          import time
          
          LOG_CAP = 256 * 1024 * 1024
          CLEANUP_BUDGETS = (5.0, 5.0, 10.0)
          POLL = 0.05
          MAX_PROC = 65_536
          MAX_OWNED = 4096
          _active = False
          _poisoned = False
          
          
          def _key(row):
              return row["pid"], row["start_ticks"]
          
          
          def _stat(pid):
              raw = Path("/proc", str(pid), "stat").read_text()
              end = raw.rfind(")")
              if end < 0 or raw[:raw.find(" (")] != str(pid):
                  raise RuntimeError("invalid /proc stat envelope")
              fields = raw[end + 2:].split()
              if len(fields) < 20:
                  raise RuntimeError("short /proc stat")
              return {"pid": pid, "state": fields[0], "ppid": int(fields[1]),
                      "pgid": int(fields[2]), "session": int(fields[3]),
                      "start_ticks": int(fields[19])}
          
          
          def _snapshot():
              rows = {}
              with os.scandir("/proc") as entries:
                  for entry in entries:
                      if not entry.name.isdigit():
                          continue
                      if len(rows) >= MAX_PROC:
                          raise RuntimeError("process census bound exceeded")
                      pid = int(entry.name)
                      try:
                          rows[pid] = _stat(pid)
                      except OSError as exc:
                          if exc.errno not in (errno.ENOENT, errno.ESRCH):
                              raise
              return rows
          
          
          class _LinuxTracker:
              """Single-runner child-subreaper + generation-pinned signaling.
          
              No name-wide/group-wide kill. Every signal uses a pidfd captured across
              matching /proc start-tick reads. Group membership is checked independently.
              """
              def __init__(self):
                  if sys.platform != "linux" or threading.current_thread() is not threading.main_thread():
                      raise RuntimeError("requires a dedicated Linux main-thread runner")
                  if threading.active_count() != 1:
                      raise RuntimeError("concurrent runner threads are not admitted")
                  if not hasattr(os, "pidfd_open") or not hasattr(signal, "pidfd_send_signal"):
                      raise RuntimeError("Python/kernel pidfd support required")
                  self.controller = os.getpid()
                  self.rows = {}
                  self.fds = {}
                  self.root = None
                  self.root_key = None
                  self.unknown_group = []
                  self.reaped = []
                  self.signal_events = {}
                  self.last_snapshot = {}
                  self.previous_subreaper = None
                  self.libc = None
                  if any(r["ppid"] == self.controller for r in _snapshot().values()):
                      raise RuntimeError("runner already owns children")
                  probe = os.pidfd_open(self.controller, 0)
                  os.close(probe)
                  self.libc = ctypes.CDLL(None, use_errno=True)
                  self.libc.prctl.argtypes = [ctypes.c_int, ctypes.c_ulong, ctypes.c_ulong,
                                            ctypes.c_ulong, ctypes.c_ulong]
                  self.libc.prctl.restype = ctypes.c_int
                  previous = ctypes.c_int()
                  self._prctl(37, ctypes.addressof(previous))  # PR_GET_CHILD_SUBREAPER
                  self.previous_subreaper = previous.value
                  self._prctl(36, 1)  # PR_SET_CHILD_SUBREAPER
          
              def _prctl(self, option, value):
                  if self.libc.prctl(option, value, 0, 0, 0) != 0:
                      raise OSError(ctypes.get_errno(), "prctl child-subreaper")
          
              def admit(self, child):
                  self.root = child
                  row = _stat(child.pid)
                  if row["ppid"] != self.controller or row["pgid"] != child.pid or row["session"] != child.pid:
                      raise RuntimeError("new child session identity mismatch")
                  self.root_key = _key(row)
                  self._capture(row)
          
              def _capture(self, row):
                  key = _key(row)
                  if key in self.fds:
                      self.rows[key]["last"] = row
                      return
                  if len(self.fds) >= MAX_OWNED:
                      raise RuntimeError("owned identity bound exceeded")
                  try:
                      fd = os.pidfd_open(row["pid"], 0)
                  except ProcessLookupError:
                      return
                  try:
                      again = _stat(row["pid"])
                      if _key(again) != key:
                          return
                      self.fds[key] = fd
                      self.rows[key] = {"first": row, "last": again}
                      fd = None
                  except FileNotFoundError:
                      pass
                  finally:
                      if fd is not None:
                          os.close(fd)
          
              def refresh(self):
                  snap = _snapshot()
                  self.last_snapshot = snap
                  # Direct children include reparented double-fork/session escapes because
                  # this dedicated controller remains their nearest live subreaper.
                  owned = {pid for pid, row in snap.items() if row["ppid"] == self.controller}
                  owned.update(pid for pid, row in snap.items() if _key(row) in self.rows)
                  while True:
                      added = {pid for pid, row in snap.items() if row["ppid"] in owned}
                      if added <= owned:
                          break
                      owned.update(added)
                  for pid in sorted(owned):
                      self._capture(snap[pid])
                  self.unknown_group = []
                  if self.root is not None:
                      for pid, row in snap.items():
                          if row["pgid"] == self.root.pid and pid not in owned:
                              self.unknown_group.append(row)
                  return self.live()
          
              def live(self):
                  # Zombies are still custody until wait/reaping makes them disappear.
                  return [row for row in self.last_snapshot.values() if _key(row) in self.rows]
          
              def signal_owned(self, signum):
                  errors = []
                  for key, fd in list(self.fds.items()):
                      try:
                          signal.pidfd_send_signal(fd, signum)
                          self.signal_events.setdefault((key, signum), {"pid": key[0], "start_ticks": key[1], "signal": signum, "firstMonotonic": time.monotonic()})
                      except ProcessLookupError:
                          pass
                      except OSError as exc:
                          errors.append(str(exc))
                  # Admission itself may fail before a root pidfd was captured. Popen's
                  # unreaped direct-child ownership prevents PID reuse for this fallback.
                  if self.root is not None and self.root.poll() is None and not any(k[0] == self.root.pid for k in self.fds):
                      try:
                          self.root.send_signal(signum)
                          self.signal_events.setdefault((("direct-child", self.root.pid), signum), {"pid": self.root.pid, "signal": signum, "directUnreapedChildFallback": True, "firstMonotonic": time.monotonic()})
                      except ProcessLookupError:
                          pass
                  return errors
          
              def reap(self):
                  if self.root is not None:
                      self.root.poll()
                  while True:
                      try:
                          pid, status = os.waitpid(-1, os.WNOHANG)
                      except ChildProcessError:
                          return
                      if pid == 0:
                          return
                      rc = os.waitstatus_to_exitcode(status)
                      self.reaped.append({"pid": pid, "returncode": rc})
                      if self.root is not None and pid == self.root.pid:
                          self.root.returncode = rc
          
              def closed(self):
                  self.reap()
                  self.refresh()
                  direct = [r for r in self.last_snapshot.values() if r["ppid"] == self.controller]
                  group = [] if self.root is None else [r for r in self.last_snapshot.values() if r["pgid"] == self.root.pid]
                  return not self.live() and not direct and not group and not self.unknown_group
          
              def evidence(self):
                  return {"identities": list(self.rows.values()), "remaining": self.live(),
                          "unknownGroupMembers": self.unknown_group, "reapedAdoptedChildren": self.reaped,
                          "subreaperPrevious": self.previous_subreaper,
                          "signalsSent": list(self.signal_events.values()),
                          "signaling": "pidfd, no process-name or group-wide signaling"}
          
              def finish(self, closure):
                  try:
                      for fd in self.fds.values():
                          os.close(fd)
                  finally:
                      # Leave subreaper ownership active if a child remains unknown/live.
                      if closure and self.previous_subreaper is not None:
                          self._prctl(36, self.previous_subreaper)
          
          
          def _native_exit(rc):
              return rc if rc >= 0 else 128 - rc
          
          
          def _run_phase(name, argv, deadline, env, cwd, evidence_dir, reserve_free_bytes,
                         tracker_factory, disk_usage, cleanup_budgets=CLEANUP_BUDGETS,
                         log_cap=LOG_CAP):
              global _active, _poisoned
              if _active or _poisoned:
                  raise RuntimeError("runner has an active phase or unclosed prior custody")
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,79}", name):
                  raise ValueError("invalid exclusive phase name")
              if not isinstance(argv, list) or not argv or not all(isinstance(x, str) and "\0" not in x for x in argv):
                  raise ValueError("argv must be a nonempty string list")
              if not isinstance(env, dict) or not all(isinstance(k, str) and isinstance(v, str) for k, v in env.items()):
                  raise ValueError("explicit string environment required")
              if not isinstance(deadline, (int, float)) or isinstance(deadline, bool) or not time.monotonic() < deadline < float("inf"):
                  raise ValueError("future finite absolute monotonic work deadline required")
              if type(reserve_free_bytes) is not int or reserve_free_bytes < 0:
                  raise ValueError("invalid free-space reserve")
              cwd = os.fspath(cwd)
              directory = Path(evidence_dir) / name
              directory.mkdir(mode=0o700, parents=False, exist_ok=False)
              _active = True
              start = time.monotonic()
              result = {"schema": "orbital.linux-phase-containment/1", "name": name,
                        "argv": argv, "cwd": cwd, "workDeadlineMonotonic": deadline,
                        "startedMonotonic": start, "cleanupBudgetsSeconds": list(cleanup_budgets),
                        "environmentSHA256": hashlib.sha256(json.dumps(env, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
                        "reserveFreeBytes": reserve_free_bytes, "combinedLogCapBytes": log_cap,
                        "nativeLaunched": False, "native_returncode": None,
                        "exit_code": None, "reason": None, "errors": [], "omittedErrorCount": 0,
                        "logs": {}, "closure": {"verified": False},
                        "cancelSignal": None, "qualified": False,
                        "deadlineOverrun": False, "deadlineOverrunObservation": None,
                        "workDeadlineOverrunObservation": None}
              tracker = child = selector = None
              streams = {}
              output_files = {}
              hashes = {"stdout": hashlib.sha256(), "stderr": hashlib.sha256()}
              counts = {"stdout": 0, "stderr": 0}
              discarded = 0
              old_handlers = {}
              canceled = []
              cleanup_start = None
              closure = False
              clean_scans = 0
              term_end = kill_end = cleanup_end = None
              primary = None
          
              def fail(reason, code, detail=None):
                  nonlocal primary, cleanup_start, term_end, kill_end, cleanup_end
                  if detail is not None:
                      if len(result["errors"]) < 128:
                          result["errors"].append({"reason": reason, "detail": str(detail)[:2048]})
                      else:
                          result["omittedErrorCount"] += 1
                  if primary is None or (primary[1] == 0 and code != 0):
                      primary = (reason, code)
                  if cleanup_start is None:
                      cleanup_start = time.monotonic()
                      term_end = cleanup_start + cleanup_budgets[0]
                      kill_end = term_end + cleanup_budgets[1]
                      cleanup_end = kill_end + cleanup_budgets[2]
          
              def check_cleanup_deadline(stage):
                  observed = time.monotonic()
                  if cleanup_end is not None and observed >= cleanup_end:
                      if not result["deadlineOverrun"]:
                          result["deadlineOverrun"] = True
                          result["deadlineOverrunObservation"] = {
                              "stage": stage, "monotonic": observed,
                              "cleanupDeadlineMonotonic": cleanup_end}
                          fail("cleanup_deadline_overrun", 125)
                      return True
                  return False
          
              def cancel(signum, _frame):
                  if not canceled:
                      canceled.append(signum)
          
              def free_guard(extra=0):
                  if disk_usage(directory).free < reserve_free_bytes + extra:
                      fail("disk_reserve", 125)
          
              def close_pipe(fd):
                  stream = streams.pop(fd)
                  try:
                      if selector is not None:
                          selector.unregister(fd)
                  except (KeyError, ValueError):
                      pass
                  stream[0].close()
          
              def pump(timeout):
                  nonlocal discarded
                  if selector is None:
                      time.sleep(timeout)
                      return
                  for event, _ in selector.select(timeout):
                      fd = event.fd
                      try:
                          chunk = os.read(fd, 64 * 1024)
                      except BlockingIOError:
                          continue
                      if not chunk:
                          close_pipe(fd)
                          continue
                      label = streams[fd][1]
                      free_guard(len(chunk))
                      left = log_cap - sum(counts.values())
                      if len(chunk) > left:
                          fail("combined_log_cap", 125)
                      # After a disk/evidence fault, drain/discard instead of writing more.
                      keep = 0 if primary and primary[0] in ("disk_reserve", "evidence_error") else min(len(chunk), left)
                      written = 0
                      while written < keep:
                          amount = output_files[label].write(chunk[written:keep])
                          if not amount:
                              raise OSError("zero-byte log write")
                          hashes[label].update(chunk[written:written + amount])
                          counts[label] += amount
                          written += amount
                      discarded += len(chunk) - keep
          
              try:
                  for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                      old_handlers[sig] = signal.getsignal(sig)
                      signal.signal(sig, cancel)
                  free_guard()
                  if primary is None:
                      tracker = tracker_factory()
                  if canceled:
                      fail("canceled", 128 + canceled[0])
                  if time.monotonic() >= deadline:
                      fail("work_deadline", 124)
                  if primary is None:
                      for label in ("stdout", "stderr"):
                          output_files[label] = (directory / (label + ".log")).open("xb", buffering=0)
                      selector = selectors.DefaultSelector()
                      child = subprocess.Popen(argv, cwd=cwd, env=env, stdin=subprocess.DEVNULL,
                                               stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                               start_new_session=True, close_fds=True)
                      result["nativeLaunched"] = True
                      result["pid"] = child.pid
                      # Ownership is established before any fallible pipe setup.
                      tracker.root = child
                      for stream, label in ((child.stdout, "stdout"), (child.stderr, "stderr")):
                          streams[stream.fileno()] = (stream, label)
                      tracker.admit(child)
                      for fd in streams:
                          os.set_blocking(fd, False)
                          selector.register(fd, selectors.EVENT_READ)
                  while child is not None:
                      now = time.monotonic()
                      if canceled:
                          fail("canceled", 128 + canceled[0])
                      if cleanup_start is None and now >= deadline:
                          fail("work_deadline", 124)
                      rc = child.poll()
                      polled_at = time.monotonic()
                      if cleanup_start is None and polled_at >= deadline:
                          result["workDeadlineOverrunObservation"] = {
                              "stage": "after_child_poll", "monotonic": polled_at,
                              "workDeadlineMonotonic": deadline}
                          if rc is not None and rc != 0:
          FIVE_CASE_CONTAINMENT_PY_1
      - name: Materialize containment.py part 2
        timeout-minutes: 1
        run: |
          set -eu
          FIVE_CASE_PROGRAM="$RUNNER_TEMP/observer-isolation-five-case/program"
          mkdir -p "$FIVE_CASE_PROGRAM"
          cat >> "$FIVE_CASE_PROGRAM/containment.py" <<'FIVE_CASE_CONTAINMENT_PY_2'
                              fail("native_exit", _native_exit(rc))
                          fail("work_deadline", 124)
                      if rc is not None:
                          result["native_returncode"] = rc
                          if rc != 0:
                              fail("native_exit", _native_exit(rc))
                          elif cleanup_start is None:
                              # Normal root completion still drains/reaps all descendants.
                              fail("native_exit", 0)
                      if cleanup_start is None and now >= deadline:
                          fail("work_deadline", 124)
                      try:
                          free_guard()
                          tracker.refresh()
                      except Exception as exc:
                          fail("custody_error", 125, exc)
                      if cleanup_start is not None:
                          if check_cleanup_deadline("before_cleanup"):
                              break
                          try:
                              signum = signal.SIGTERM if now < term_end else signal.SIGKILL
                              for error in tracker.signal_owned(signum):
                                  fail("signal_error", 125, error)
                              if tracker.closed():
                                  clean_scans += 1
                              else:
                                  clean_scans = 0
                              if clean_scans >= 2 and not streams:
                                  closure = True  # Physical closure is distinct from timeliness.
                                  check_cleanup_deadline("after_normal_closure")
                                  break
                              if check_cleanup_deadline("after_normal_closure_scan"):
                                  break
                          except Exception as exc:
                              clean_scans = 0
                              fail("custody_error", 125, exc)
                      try:
                          bound = deadline if cleanup_start is None else cleanup_end
                          pump(max(0.0, min(POLL, bound - time.monotonic())))
                      except Exception as exc:
                          fail("evidence_error", 125, exc)
                  if child is None:
                      closure = True
              except Exception as exc:
                  fail("setup_or_supervision_error", 125, exc)
              finally:
                  if child is None:
                      closure = True
                  # Exceptions during launch/setup use the same single cleanup reserve.
                  if child is not None and not closure:
                      if cleanup_start is None:
                          fail("cleanup_required", 125)
                      while time.monotonic() < cleanup_end:
                          try:
                              tracker.refresh()
                          except Exception as exc:
                              fail("custody_error", 125, exc)
                          try:
                              if check_cleanup_deadline("before_fallback_cleanup"):
                                  break
                              now = time.monotonic()
                              signum = signal.SIGTERM if now < term_end else signal.SIGKILL
                              for error in tracker.signal_owned(signum):
                                  fail("signal_error", 125, error)
                              tracker.reap()
                              if tracker.closed():
                                  clean_scans += 1
                              else:
                                  clean_scans = 0
                              # Pipe registration may have failed. Unregistered pipe FDs
                              # are still owned and will be closed after containment.
                              registered = {key.fd for key in selector.get_map().values()} if selector else set()
                              if clean_scans >= 2 and not (set(streams) & registered):
                                  closure = True
                                  check_cleanup_deadline("after_fallback_closure")
                                  break
                              if check_cleanup_deadline("after_fallback_closure_scan"):
                                  break
                              pump(max(0.0, min(POLL, cleanup_end - time.monotonic())))
                          except Exception as exc:
                              fail("cleanup_error", 125, exc)
                              time.sleep(min(POLL, max(0.0, cleanup_end - time.monotonic())))
                      if not closure:
                          fail("closure_unverified", 125, "owned group/descendants or pipe EOF not verified before cleanup deadline")
                  for fd in list(streams):
                      try:
                          close_pipe(fd)
                      except Exception as exc:
                          fail("pipe_close_error", 125, exc)
                  if selector is not None:
                      try:
                          selector.close()
                      except Exception as exc:
                          fail("selector_close_error", 125, exc)
                  for label, stream in output_files.items():
                      try:
                          stream.close()
                      except Exception as exc:
                          fail("log_close_error", 125, exc)
                  if child is not None:
                      try:
                          result["native_returncode"] = child.poll()
                      except Exception as exc:
                          fail("native_poll_error", 125, exc)
                  if tracker is not None:
                      try:
                          result["closure"].update(tracker.evidence())
                          tracker.finish(closure)
                      except Exception as exc:
                          closure = False
                          fail("tracker_finish_error", 125, exc)
                  for sig, handler in old_handlers.items():
                      try:
                          signal.signal(sig, handler)
                      except Exception as exc:
                          fail("signal_restore_error", 125, exc)
                  if canceled:
                      fail("canceled", 128 + canceled[0])
                  result["closure"]["verified"] = closure
                  result["closure"]["cleanupStartedMonotonic"] = cleanup_start
                  result["closure"]["cleanupDeadlineMonotonic"] = cleanup_end
                  result["cancelSignal"] = canceled[0] if canceled else None
                  # Includes pipe/log close, tracker finish and handler restoration.
                  check_cleanup_deadline("after_terminal_cleanup")
                  result["endedMonotonic"] = time.monotonic()
                  result["discardedOutputBytes"] = discarded
                  result["logs"] = {label: {"path": str(directory / (label + ".log")),
                                           "bytes": counts[label], "sha256": hashes[label].hexdigest()}
                                    for label in output_files}
                  if primary is None:
                      primary = ("not_launched", 125)
                  reason, code = primary
                  # Never replace an observed nonzero original outcome with cleanup code.
                  # Conversely, cleanup/evidence faults cannot preserve an apparent zero.
                  if code == 0 and (not closure or result["errors"]):
                      code, reason = 125, "closure_or_evidence_failure"
                  result["exit_code"], result["reason"] = code, reason
                  result["qualified"] = code == 0 and closure and result["native_returncode"] == 0
                  overrun_before_publication = result["deadlineOverrun"]
                  try:
                      with (directory / "RESULT.json").open("x", encoding="utf-8") as stream:
                          json.dump(result, stream, indent=2, allow_nan=False)
                          stream.write("\n")
                      # Serialization, writes and file close can themselves return late.
                      # Correct this invocation's own provisional receipt if it advertised
                      # success before a now-known publication overrun. No reserve rearm.
                      if check_cleanup_deadline("after_result_publication"):
                          result["exit_code"], result["reason"] = primary[1], primary[0]
                          result["qualified"] = False
                          result["endedMonotonic"] = time.monotonic()
                          if not overrun_before_publication:
                              with (directory / "RESULT.json").open("w", encoding="utf-8") as stream:
                                  json.dump(result, stream, indent=2, allow_nan=False)
                                  stream.write("\n")
                  except Exception as exc:
                      fail("result_publication_error", 125, exc)
                      result["qualified"] = False
                      if result["exit_code"] == 0:
                          result["exit_code"], result["reason"] = 125, "result_publication_error"
                  _poisoned = not closure
                  _active = False
              return result
          
          
          def run_phase(name, argv, deadline, env, cwd, evidence_dir, reserve_free_bytes=2 * 1024**3):
              """Run one Linux phase; return receipt dict including exit_code.
          
              evidence_dir must exist; its exclusive name child must not exist.
              deadline is the work cutoff, not the cleanup cutoff. Caller reserves the
              additional fixed 20 seconds before its whole-job custody deadline.
              This function is synchronous; a dedicated runner must never concurrently
              spawn other children or start another phase. Cancellation is returned as a
              nonzero result after cleanup; caller must not launch subsequent phases.
              """
              return _run_phase(name, argv, deadline, env, cwd, evidence_dir,
