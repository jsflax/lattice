                  sequence += 1
                  # Preserve the 20-second cleanup allowance before either phase boundary.
                  bound = pre_end - 20 if until is None else until
                  available = bound - uptime()
                  if timeout is not None:
                      available = min(available, timeout)
                  if available <= 0:
                      raise TimeoutError("phase budget exhausted before " + label)
                  work_deadline = time.monotonic() + available
                  name = "%03d-%s" % (sequence, label)
                  if label == "test":
                      test_phase = evidence / "commands" / name
                  entry = {"name": name, "result": None, "startedUptime": uptime()}
                  report["phases"].append(entry)
                  save()
                  result = run_phase(name, argv, work_deadline, environment,
                                     str(cwd or work), evidence / "commands", reserve_free_bytes=2 * GiB)
                  entry["result"] = result
                  if result.get("cancelSignal"):
                      canceled = True
                  save()
                  if result["exit_code"] != 0:
                      raise RuntimeError("phase failed: " + name)
                  return (evidence / "commands" / name / "stdout.log").read_bytes()
          
              # Source checks use only the read-only Git interface through the same containment.
              current_git_deadline = None
              def git(arguments, directory):
                  return command("git", ["git", "-c", "safe.directory=" + str(directory),
                                 "-c", "core.fsmonitor=false", *arguments],
                                 until=current_git_deadline, cwd=directory, timeout=15)
          
              def snapshot(label, graph=False):
                  source, pins = verify_checkout(work, evidence / label / "source", git)
                  if graph:
                      verify_graph(owned / "scratch", pins, evidence / label / "graph", git)
                  return source
          
              def cancel(signum, frame):
                  nonlocal canceled
                  canceled = True
                  raise InterruptedError("runner received signal " + str(signum))
          
              signal.signal(signal.SIGTERM, cancel)
              signal.signal(signal.SIGINT, cancel)
              save()
              try:
                  if platform.system() != "Linux" or platform.machine() != "x86_64" or os.getuid() != 0:
                      raise ValueError("requires root in the allocated Linux x64 job container")
                  if os.environ.get("CI") != "true" or os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                      raise ValueError("ordinary hosted CI and first attempt required")
                  if uptime() >= pre_end - 20:
                      raise TimeoutError("bootstrap consumed pre-test allocation")
                  free = shutil.disk_usage(evidence).free
                  report["initialFreeBytes"] = free
                  if free < 10 * GiB:
                      raise ValueError("fresh disk admission requires at least 10 GiB free")
                  if owned.exists() or os.path.lexists(fixed_log):
                      raise ValueError("owned route or fixed test log is not fresh/exclusive")
                  owned.mkdir(mode=0o700)
                  for child in ("scratch", "cache", "config", "security", "tmp"):
                      (owned / child).mkdir(mode=0o700)
                  report["ownedDirectory"] = str(owned)
                  report["temporaryDisposition"] = "created-owned"
                  fixed_admitted = True
                  environment.update(TMPDIR=str(owned / "tmp"))
                  report["relevantEnvironment"] = {k: environment[k] for k in
                      ("CI", "TMPDIR", "GIT_NO_LAZY_FETCH", "TERM", "NO_COLOR")}
                  report["platform"] = {"uname": list(platform.uname()),
                                        "osRelease": Path("/etc/os-release").read_text(),
                                        "python": sys.version, "pythonExecutable": sys.executable}
                  report["sourceBaseline"] = snapshot("before-setup")["tree"]
                  command("apt-index", ["apt-get", "-o", "Acquire::Retries=0", "update"], timeout=180)
                  command("apt-sqlite", ["apt-get", "-o", "Acquire::Retries=0", "install", "-y",
                                         "--no-install-recommends", "libsqlite3-dev", "sqlite3"], timeout=180)
                  swift = shutil.which("swift", path=environment.get("PATH"))
                  if not swift:
                      raise ValueError("Swift not found in pinned container")
                  # Preserve the swift symlink basename: the driver selects its mode from argv[0].
                  report["swiftExecutable"] = hashed_file(Path(swift).resolve())
                  report["swiftInvocationPath"] = swift
                  version = command("swift-version", [swift, "--version"], timeout=30).decode()
                  report["swiftVersion"] = version
                  if "Swift version 6.3.3" not in version or "Target: x86_64-unknown-linux-gnu" not in version:
                      raise ValueError("toolchain differs from recorded stable Linux image")
                  report["configuration"] = "debug"
                  argv = [swift, "test", "--package-path", str(work), "--scratch-path", str(owned / "scratch"),
                          "--cache-path", str(owned / "cache"), "--config-path", str(owned / "config"),
                          "--security-path", str(owned / "security"), "--configuration", "debug",
                          "--force-resolved-versions", "--skip-update", "--jobs", "4", "--disable-xctest",
                          "--enable-swift-testing", "--no-parallel", "--filter", OWNER_FILTER]
                  report["baseTestArgv"] = argv
                  listed = command("build-discover", argv + ["--list-tests"])
                  report["discovery"] = validate_discovery(listed.decode("utf-8"))
                  snapshot("after-discovery", graph=True)
                  # Expected SwiftPM output for this package/configuration/triple; never directly launched.
                  image = owned / "scratch" / "x86_64-unknown-linux-gnu" / "debug" / "LatticePackageTests.xctest"
                  if not image.is_file() or image.is_symlink():
                      raise ValueError("expected just-built test executable is missing/nonphysical")
                  with image.open("rb") as f:
                      if f.read(4) != b"\x7fELF":
                          raise ValueError("test image is not an ELF executable")
                  report["testImage"] = hashed_file(image)
                  snapshot("before-test", graph=True)
                  if hashed_file(image) != report["testImage"]:
                      raise ValueError("test executable changed before execution")
                  if uptime() > pre_end or uptime() + 920 > native_end:
                      raise TimeoutError("insufficient reserved execution and cleanup budget")
                  # --skip-build can only use this just-built, provenance-checked scratch/image.
                  command("test", argv + ["--skip-build"], until=min(uptime() + 900, native_end - 20))
                  case_phase = evidence / "commands" / report["phases"][-1]["name"]
                  report["selection"] = validate_results((case_phase / "stdout.log").read_text(),
                                                          (case_phase / "stderr.log").read_text())
                  completed_selection = True
                  if hashed_file(image) != report["testImage"]:
                      raise ValueError("test image changed during execution")
              except Exception as error:
                  report["errors"].append({"type": type(error).__name__, "message": str(error)})
                  (evidence / "exception.txt").write_text(traceback.format_exc())
              finally:
                  report["canceled"] = canceled
                  if test_phase is not None and "selection" not in report:
                      try:
                          report["selection"] = validate_results((test_phase / "stdout.log").read_text(),
                                                                 (test_phase / "stderr.log").read_text())
                      except Exception as error:
                          report["selectionIncomplete"] = str(error)
                  # Final source/dependency custody remains inside the evidence reserve; no native tests follow.
                  current_git_deadline = started + 2490
                  try:
                      if canceled or any(not (p["result"] or {}).get("closure", {}).get("verified", False)
                                         for p in report["phases"]):
                          raise RuntimeError("final native custody skipped after cancellation/unverified closure")
                      snapshot("final", graph=(owned / "scratch" / "workspace-state.json").is_file())
                      report["finalProvenance"] = True
                  except Exception as error:
                      report["errors"].append({"phase": "final-provenance", "message": str(error)})
                  try:
                      if fixed_admitted and os.path.lexists(fixed_log):
                          data = regular_bytes(fixed_log, Path("/tmp"), limit=128 * MiB)
                          (evidence / "lattice_swift_tests.log").write_bytes(data)
                          report["fixedLog"] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
                      if owned.exists():
                          temp = owned / "tmp"
                          closure_ok = all((p["result"] or {}).get("closure", {}).get("verified", False)
                                           for p in report["phases"])
                          report["allOwnedPhaseClosuresVerified"] = closure_ok
                          if not closure_ok:
                              raise ValueError("incomplete process closure; owned data retained without archiving")
                          entries, queue, size = [], [(temp, 0)], 0
                          while queue:
                              directory, depth = queue.pop()
                              if depth > 16:
                                  raise ValueError("temporary evidence depth bound")
                              with os.scandir(directory) as scan:
                                  for child in scan:
                                      p = Path(child.path)
                                      entries.append(p)
                                      if len(entries) > 4096 or child.is_symlink():
                                          raise ValueError("temporary evidence count/symlink bound")
                                      if child.is_dir(follow_symlinks=False):
                                          queue.append((p, depth + 1))
                                      elif child.is_file(follow_symlinks=False):
                                          size += child.stat(follow_symlinks=False).st_size
                                          if size > 256 * MiB:
                                              raise ValueError("temporary evidence exceeds retention cap")
                                      else:
                                          raise ValueError("nonregular temporary evidence")
                          report["temporaryEvidenceBytes"] = size
                          if size > 256 * MiB or shutil.disk_usage(evidence).free < 512 * MiB + size:
                              raise ValueError("temporary evidence exceeds retention/reserve cap; kept owned directory")
                          # Keep failure/success temporary data before deleting any of it.
                          with tarfile.open(evidence / "owned-temporary-data.tar", "w") as archive:
                              archive.add(temp, arcname="owned-temp", recursive=False)
                              for p in entries:
                                  archive.add(p, arcname="owned-temp/" + str(p.relative_to(temp)), recursive=False)
                          shutil.rmtree(temp)
                          if fixed_admitted and fixed_log.exists():
                              fixed_log.unlink()
                          report["temporaryDisposition"] = "archived-and-removed-owned-tmp"
                          report["scratchCacheDisposition"] = "retained-in-ephemeral-job-until-platform-disposal"
                  except Exception as error:
                      report["errors"].append({"phase": "evidence-cleanup", "message": str(error)})
                  report["accepted"] = bool(completed_selection and not report["errors"]
                                            and report.get("finalProvenance")
                                            and report.get("allOwnedPhaseClosuresVerified"))
                  save()
                  inventory = []
                  for p in sorted(evidence.rglob("*")):
                      if p.is_file() and not p.is_symlink() and p.name != "FILES.json":
                          item = hashed_file(p)
                          item["path"] = str(p.relative_to(evidence))
                          inventory.append(item)
                  (evidence / "FILES.json").write_text(json.dumps(inventory, indent=2) + "\n")
                  # Receiving requires this completion marker AND successful outer step/upload.
                  # A late hash/write failure cannot be accepted from RESULT.json alone.
                  completion = {"schema": "lattice.five-case-local-custody/1",
                                "accepted": report["accepted"], "result": hashed_file(evidence / "RESULT.json"),
                                "inventory": hashed_file(evidence / "FILES.json"),
                                "requiresSuccessfulDiagnosticStepAndArtifactUpload": True}
                  with (evidence / "COMPLETION.json").open("x") as f:
                      json.dump(completion, f, indent=2)
                      f.write("\n")
                  print(json.dumps({"accepted": report["accepted"], "diagnosticOnly": True,
                                    "errors": report["errors"]}))
              return 0 if report["accepted"] else 1
          
          
          if __name__ == "__main__":
              sys.exit(main())
          FIVE_CASE_RUNNER_PY_1
      - name: Run contained five-case diagnostic
        id: diagnostic
        timeout-minutes: 42
        env:
          FIVE_CASE_CONTAINER_ID: ${{ job.container.id }}
        run: |
          set -eu
          FIVE_CASE_PROGRAM="$RUNNER_TEMP/observer-isolation-five-case/program"
          python -I -B "$FIVE_CASE_PROGRAM/runner.py"

      - name: Record platform step outcomes
        if: always()
        timeout-minutes: 1
        env:
          FIVE_CASE_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -eu
          FIVE_CASE_EVIDENCE="$RUNNER_TEMP/observer-isolation-five-case"
          mkdir -p "$FIVE_CASE_EVIDENCE"
          printf '%s\n' "$FIVE_CASE_STEP_OUTCOMES" > "$FIVE_CASE_EVIDENCE/platform-step-outcomes.json"
          if [ ! -f "$FIVE_CASE_EVIDENCE/RESULT.json" ]; then
            printf '%s\n' '{"accepted":false,"diagnosticOnly":true,"reason":"supervisor-result-missing","processClosure":"unverified"}' > "$FIVE_CASE_EVIDENCE/BOOTSTRAP-INCOMPLETE.json"
          fi

      - name: Preserve diagnostic evidence including failure
        if: always()
        id: custody
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: observer-isolation-five-case-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer-isolation-five-case
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
