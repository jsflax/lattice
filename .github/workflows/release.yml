name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  # Releasability gate: clean tag-at-origin/main, latticecore pin sanity
  # (edit-mode detector), changelog section, semver-monotonic tag, CI green
  # for the exact commit. See Scripts/release-preflight.sh.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - &release_checkout
        name: Fetch full-history release source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          WRAPPER_RELEASE_ROOT="$HOME/localdev/lw-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$WRAPPER_RELEASE_ROOT"
          mkdir -p "$WRAPPER_RELEASE_ROOT/tmp"
          export TMPDIR="$WRAPPER_RELEASE_ROOT/tmp" TMP="$WRAPPER_RELEASE_ROOT/tmp" TEMP="$WRAPPER_RELEASE_ROOT/tmp"
          {
            echo "WRAPPER_RELEASE_ROOT=$WRAPPER_RELEASE_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
          } >> "$GITHUB_ENV"
          git init "$WRAPPER_RELEASE_ROOT/source"
          git -C "$WRAPPER_RELEASE_ROOT/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$WRAPPER_RELEASE_ROOT/source" fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git -C "$WRAPPER_RELEASE_ROOT/source" fetch origin "$GITHUB_SHA"
          git -C "$WRAPPER_RELEASE_ROOT/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$WRAPPER_RELEASE_ROOT/source" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$WRAPPER_RELEASE_ROOT/source" rev-parse --is-shallow-repository)" = false
      - name: Release preflight
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.WRAPPER_RELEASE_ROOT }}/source
        run: ./Scripts/release-preflight.sh "${GITHUB_REF_NAME}"

  # The release test gates ARE the CI gates — called, not copy-pasted, so
  # they cannot drift (a 6.2-container bug once lived in two files).
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tests, preflight]
    runs-on: ubuntu-latest
    steps:
      - *release_checkout

      - name: Extract version from tag
        id: version
        working-directory: ${{ env.WRAPPER_RELEASE_ROOT }}/source
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        working-directory: ${{ env.WRAPPER_RELEASE_ROOT }}/source
        run: |
          # Extract the section for this version from CHANGELOG.md
          awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > "$WRAPPER_RELEASE_ROOT/release_notes.md"
          echo "has_notes=$([ -s "$WRAPPER_RELEASE_ROOT/release_notes.md" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && format('{0}/release_notes.md', env.WRAPPER_RELEASE_ROOT) || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}

  notify-slack:
    needs: release
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/slack-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
