name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  # Releasability gate: clean tag-at-origin/main, latticecore pin sanity
  # (edit-mode detector), changelog section, semver-monotonic tag, CI green
  # for the exact commit. See Scripts/release-preflight.sh.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all tags: the monotonicity check walks every tag.
          fetch-depth: 0
      - name: Release preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/release-preflight.sh "${GITHUB_REF_NAME}"

  # The release test gates ARE the CI gates — called, not copy-pasted, so
  # they cannot drift (a 6.2-container bug once lived in two files).
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tests, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > release_notes.md
          echo "has_notes=$([ -s release_notes.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}
