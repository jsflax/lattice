name: Attached corrected baseline legacy prerequisites
# Proposal only. Root reviews and installs this plus the exact sealed packet.
on:
  push:
    branches: [codex/perf-qualification-20260918]
    paths: ['.github/workflows/attached-baseline-correctness.yml', 'Scripts/attached-baseline-correctness/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attached-correctness:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PACKET_SEAL_SHA256: 4745ddf820344e9d29404cbe2e8775db39cffa7f6b1b0206fff6be31af108c88
    steps:
      - name: Fetch exact qualification tools under localdev
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-attached-correctness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TASK_ROOT
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['TASK_ROOT'])
          record = {k: os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'PACKET_SEAL_SHA256')}
          (root / 'workflow-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Prove tiny selector, then fresh corrected Release build and four unchanged legacy prerequisites
        timeout-minutes: 310
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          python3 -B "$TASK_ROOT/tools/Scripts/attached-baseline-correctness/qualify.py" \
            --root "$TASK_ROOT/qualification" \
            --packet-seal-sha256 "$PACKET_SEAL_SHA256"
      - name: Preserve predecessor, legacy result, and failure evidence
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: attached-baseline-correctness-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/workflow-source.json
            ${{ env.TASK_ROOT }}/qualification/receipts
            ${{ env.TASK_ROOT }}/qualification/corrected/logs
            ${{ env.TASK_ROOT }}/qualification/corrected/tmp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
