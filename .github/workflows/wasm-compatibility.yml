name: WASM compile and JS unit compatibility (partial)
# Install with the three reviewed companion files in Scripts/wasm-compat/.
# This is a supplementary gate, not browser or release qualification.
on:
  push:
    branches: [codex/perf-qualification-20260918]
    paths:
      - "Scripts/wasm-compat/**"
      - ".github/workflows/wasm-compatibility.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-compile-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch workflow source into owned localdev root
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-wasm-compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/workflow"
          git -C "$TASK_ROOT/workflow" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/workflow" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/workflow" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run bounded baseline A and candidate B compile/unit checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TASK_ROOT/workflow/Scripts/wasm-compat/run-wasm-compat.py" --root "$TASK_ROOT"
      - name: Retain named partial-scope evidence even on failure
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: wasm-compile-ts-vitest-PARTIAL-attempt-${{ github.run_attempt }}
          path: ${{ env.TASK_ROOT }}/receipts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
