name: Linux full-order fixture correction diagnostic (temporary)

# Exactly one diagnostic branch; no PR trigger and no required-gate changes.
on:
  push:
    branches: [private/284-linux-full-order-corrected-1]
    paths:
      - .github/workflows/linux-full-order-diagnostic.yml
      - Scripts/run-linux-full-order-diagnostic.py
      - Scripts/test-linux-full-order-diagnostic.py
      - Scripts/linux-full-order-census.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-order-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same immutable image digest reported by stable job106672035932.
    # No added capabilities, privileged mode, ptrace-policy changes or sudo.
    container: swift:6.3-noble@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    env:
      CONSUMER_LEG: linux-full-order-diagnostic
      LATTICE_ACK_PATH_DIAGNOSTICS: '1'
      LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install ordinary diagnostic tooling
        run: apt-get update && apt-get install -y libsqlite3-dev sqlite3 python3 gdb

      - name: Verify exact reviewed fixture delta and retain tool metadata
        shell: bash
        run: |
          set -eu
          EVIDENCE="$RUNNER_TEMP/wrapper-full-order-diagnostic"
          mkdir -p "$EVIDENCE"
          export EVIDENCE
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > "$EVIDENCE/checkout-sha.stdout"
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}' > "$EVIDENCE/checkout-tree.txt"
          git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain > "$EVIDENCE/checkout-status.txt"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only 7f1028ebfa9e5b4776a1aa6636a086107ca5de0a HEAD > "$EVIDENCE/source-delta.txt"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          p = Path(os.environ['EVIDENCE'])
          base = '7f1028ebfa9e5b4776a1aa6636a086107ca5de0a'
          correction = 'f0afff07429aced7693843b1f981076b0e7b5c72'
          git = ['git', '-c', 'safe.directory=' + str(workspace), '-C', str(workspace)]
          def read(*args):
              return subprocess.check_output(git + list(args), timeout=30)
          def delta(left, right):
              rows = read('diff', '--name-status', '--no-renames', left, right).decode().splitlines()
              result = {}
              for row in rows:
                  status, path = row.split('\t')
                  assert status in ('A', 'M') and path not in result, row
                  result[path] = status
              return result
          inherited = {
              '.github/workflows/linux-focused-diagnostic.yml': 'A',
              '.github/workflows/linux-full-order-diagnostic.yml': 'A',
              'Scripts/linux-full-order-census.json': 'A',
              'Scripts/run-linux-focused-diagnostic.py': 'A',
              'Scripts/run-linux-full-order-diagnostic.py': 'A',
              'Scripts/test-linux-focused-diagnostic.py': 'A',
              'Scripts/test-linux-full-order-diagnostic.py': 'A',
              'Tests/LatticeTests/LiveResultsKeysetTests.swift': 'M',
              'Tests/LatticeTests/VectorSearchTests.swift': 'M',
              'engineering/private/284-linux-budget-correction/README.md': 'A',
              'engineering/private/284-linux-budget-correction/SOURCE-VALIDATION.json': 'A',
              'engineering/private/284-linux-focused-diagnostic/README.md': 'A',
              'engineering/private/284-linux-full-order-diagnostic/README.md': 'A',
          }
          successor = {
              '.github/workflows/linux-full-order-diagnostic.yml': 'M',
              'engineering/private/284-linux-budget-correction/VALIDATION-CALLER.md': 'A',
          }
          assert not (p/'checkout-status.txt').read_text()
          assert read('rev-parse', base + '^{commit}').decode().strip() == base
          assert read('rev-parse', correction + '^{commit}').decode().strip() == correction
          assert delta(base, correction) == inherited, 'Unreviewed correction delta'
          assert delta(correction, 'HEAD') == successor, 'Unreviewed caller delta'
          expected = dict(inherited)
          expected['engineering/private/284-linux-budget-correction/VALIDATION-CALLER.md'] = 'A'
          assert delta(base, 'HEAD') == expected, 'Unexpected full source delta'
          assert set((p/'source-delta.txt').read_text().splitlines()) == set(expected)
          pinned = {
              'Tests/LatticeTests/LiveResultsKeysetTests.swift': ('5d4a54102707e02e6ef97a029f9d91bb7becb91f17a5031ff3a2f2424e5bcf16', '00fb315e9d93ff854f0f8d607ba22f3ff6e345f909475e2ef71d205b30d90262'),
              'Tests/LatticeTests/VectorSearchTests.swift': ('9edb9198f193a875b6a12668dd69f95466a3865a63e02dec8aaeddb85aa41c39', 'be13bbbad142dc2e0f912c3062847744654d3686f53e406494c13217701c1a9f'),
          }
          sha = lambda data: hashlib.sha256(data).hexdigest()
          files = {}
          for path, status in expected.items():
              before = read('show', base + ':' + path) if status == 'M' else None
              reviewed = read('show', correction + ':' + path) if path in inherited else None
              current = read('show', 'HEAD:' + path)
              assert (workspace/path).read_bytes() == current, path
              if path not in successor:
                  assert current == reviewed, 'Changed reviewed input: ' + path
              hashes = {'baselineSHA256': sha(before) if before is not None else None,
                        'reviewedCorrectionSHA256': sha(reviewed) if reviewed is not None else None,
                        'currentSHA256': sha(current)}
              if path in pinned:
                  assert (hashes['baselineSHA256'], hashes['currentSHA256']) == pinned[path], path
              files[path] = hashes
          census = json.loads((workspace/'Scripts/linux-full-order-census.json').read_bytes())
          assert (census['functionCount'], census['executingFunctionCount'], len(census['inheritedSkipKeys']), census['parameterCaseCount']) == (695,690,5,17)
          for path, pair in pinned.items():
              assert census['sourceHashes'][path] == pair[1]
              assert census['sourceOverrides']['files'][path] == {'baselineSHA256': pair[0], 'currentSHA256': pair[1]}
          receipt = {'schema':'linux-reviewed-fixture-admission/v1', 'baseline':base,
                     'reviewedCorrection':correction, 'current':read('rev-parse','HEAD').decode().strip(),
                     'files':files, 'originalRun':35721974566, 'originalOutcome':'NONPASS',
                     'originalArtifactSHA256':'fbbb5b74e2d7c36d3a6bff08a69da5f42d4b81ac93d27fd3f4bc920f71cfffda',
                     'requiredCIGateQualified':False, 'qualified':True}
          (p/'SOURCE-ADMISSION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          swift --version > "$EVIDENCE/swift-version.txt" 2>&1
          swift build --help > "$EVIDENCE/build-help.txt" 2>&1
          swift test --help > "$EVIDENCE/test-help.txt" 2>&1
          gdb --version > "$EVIDENCE/gdb-version.txt" 2>&1
          cat /proc/sys/kernel/yama/ptrace_scope > "$EVIDENCE/ptrace-scope.txt" 2>&1 || true
          python3 Scripts/verify-wrapper-lock-integrity.py --phase baseline --evidence-dir "$EVIDENCE"
          python3 Scripts/verify-wrapper-bindings.py --expected Scripts/wrapper-expected-bindings.json --resolved "$EVIDENCE/baseline/files/Package.resolved"
          python3 Scripts/verify-wrapper-lock-integrity.py --phase before-build --evidence-dir "$EVIDENCE"

      - name: Build the locked graph with exactly two reviewed fixture changes
        id: build
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/wrapper-full-order-diagnostic"
          printf '%s\0' swift build --force-resolved-versions --build-tests > "$EVIDENCE/build.argv.nul"
          status=0
          swift build --force-resolved-versions --build-tests > "$EVIDENCE/build.stdout" 2> "$EVIDENCE/build.stderr" || status=$?
          printf '%s\n' "$status" > "$EVIDENCE/build.exit-code"
          exit "$status"

      - name: Verify lock integrity before the full diagnostic
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        run: |
          set -eu
          python3 Scripts/verify-wrapper-lock-integrity.py --phase after-build --evidence-dir "$RUNNER_TEMP/wrapper-full-order-diagnostic"
          python3 Scripts/verify-wrapper-lock-integrity.py --phase before-test --evidence-dir "$RUNNER_TEMP/wrapper-full-order-diagnostic"

      - name: Run complete serial order with owned1800second diagnostic bound
        id: full_order
        shell: bash
        run: python3 Scripts/run-linux-full-order-diagnostic.py --workspace "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/wrapper-full-order-diagnostic/run"

      - name: Preserve final integrity and step outcomes
        if: always()
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/wrapper-full-order-diagnostic"
          mkdir -p "$EVIDENCE"
          printf '%s\n' "$CONSUMER_STEP_OUTCOMES" > "$EVIDENCE/step-outcomes.json"
          status=0
          python3 Scripts/verify-wrapper-lock-integrity.py --phase after-test --evidence-dir "$EVIDENCE" || status=$?
          python3 Scripts/verify-wrapper-lock-integrity.py --phase final --evidence-dir "$EVIDENCE" || status=$?
          exit "$status"

      - name: Retain partial evidence even when stacks are unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-full-order-stall-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrapper-full-order-diagnostic
          include-hidden-files: true
          if-no-files-found: error
