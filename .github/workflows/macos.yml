name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jsflax/LatticeCore
          path: ../LatticeCore

      - name: Build
        run: swift build

      - name: Test
        run: swift test
