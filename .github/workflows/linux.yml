name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jsflax/LatticeCore
          path: ../LatticeCore

      - name: Install dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
