name: CI

# Single source of truth for the test gates. `release.yml` calls this
# workflow (workflow_call) instead of copy-pasting the jobs, so the gates
# cannot drift between the push/PR path and the release path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A known intermittent relay-test hang (pre-existing, tracked for 1.0
    # item D) can wedge a run; fail fast and re-run instead of a 6h zombie.
    timeout-minutes: 90
    strategy:
      # Never let an informational nightly failure cancel the release-gating
      # stable leg.
      fail-fast: false
      matrix:
        include:
          # Must be >= the manifest's swift-tools-version (6.3): a 6.2
          # toolchain refuses the manifest at parse time, before any compile
          # error can surface.
          - image: swift:6.3-noble
            experimental: false
          # Early warning against the next toolchain. Informational only
          # (continue-on-error). Nightly images live under the swiftlang/
          # Docker org — `swift:nightly-*` does NOT exist.
          - image: swiftlang/swift:nightly-main-noble
            experimental: true
    # Marks the job green even when the nightly leg fails; the stable leg
    # still gates.
    continue-on-error: ${{ matrix.experimental }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Build-only: proves the library product compiles for iOS (the platform we
  # declare but never test on — tests need a host app). The `Lattice` scheme
  # is Xcode's auto-generated package scheme; nothing under .swiftpm/ is
  # committed. -skipMacroValidation is MANDATORY: Lattice depends on a .macro
  # target and xcodebuild refuses to run unvalidated macros non-interactively.
  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ARCHS=arm64: the x86_64 simulator slice trips an upstream LatticeCore
      # bug (SqliteVec's dependency scan pulls _Builtin_intrinsics.arm.neon,
      # "requires feature 'neon'", on x86_64). Rosetta-simulator is legacy;
      # arm64 is the slice that matters. Drop the override when LatticeCore
      # fixes the include.
      - name: Build (iOS Simulator)
        run: xcodebuild -scheme Lattice -destination 'generic/platform=iOS Simulator' build -skipMacroValidation ARCHS=arm64

  macos:
    runs-on: macos-26
    # Known intermittent relay-test hang (1.0 item D) — fail fast, re-run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # A known intermittent Darwin hang (never-resuming await in the relay
      # test family; .timeLimit cannot interrupt it) occasionally wedges the
      # run until timeout-minutes kills it. The watchdog samples the test
      # process at 20 minutes so a cancelled run leaves the stuck stacks in
      # the log instead of nothing.
      - name: Test
        run: |
          (
            sleep 1200
            PID=$(pgrep -f LatticePackageTests | head -1)
            if [ -n "$PID" ]; then
              echo "=== HANG WATCHDOG: test process $PID still alive at 20min — sampling ==="
              sample "$PID" 5 -file /tmp/hang-sample.txt 2>/dev/null || true
              cat /tmp/hang-sample.txt || true
            fi
          ) &
          WATCHDOG=$!
          swift test
          kill $WATCHDOG 2>/dev/null || true
