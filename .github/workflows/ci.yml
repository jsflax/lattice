name: Linux observation isolation control

# Temporary isolation control. Never merge this branch.
# Strict consumer verifies committed dependency bindings and complete lock integrity.
# Build and test outcomes remain independent qualification gates.

# Single source of truth for the test gates. `release.yml` calls this
# workflow (workflow_call) instead of copy-pasting the jobs, so the gates
# cannot drift between the push/PR path and the release path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Temporary control: each isolated suite process has a bounded watchdog.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Must be >= the manifest's swift-tools-version (6.3): a 6.2
          # toolchain refuses the manifest at parse time, before any compile
          # error can surface.
          - image: swift:6.3-noble
            experimental: false
            consumerLeg: linux-stable
    # This control runs only the stable Linux toolchain.
    continue-on-error: ${{ matrix.experimental }}
    container: ${{ matrix.image }}
    env:
      CONSUMER_LEG: ${{ matrix.consumerLeg }}
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git libsqlite3-dev sqlite3

      - name: Install consumer evidence tooling
        run: apt-get install -y python3 gdb

      - &wrapper_checkout
        name: Fetch exact source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$CONSUMER_LEG" =~ ^[a-z-]+$ ]]
          WRAPPER_JOB_ROOT="$HOME/localdev/lw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CONSUMER_LEG}"
          test ! -e "$WRAPPER_JOB_ROOT"
          mkdir -p "$WRAPPER_JOB_ROOT"/{tmp,swift-cache,swift-config,swift-security,module-cache,test-logs,consumer,runtime}
          chmod 700 "$WRAPPER_JOB_ROOT/runtime"
          export TMPDIR="$WRAPPER_JOB_ROOT/tmp" TMP="$WRAPPER_JOB_ROOT/tmp" TEMP="$WRAPPER_JOB_ROOT/tmp"
          {
            echo "WRAPPER_JOB_ROOT=$WRAPPER_JOB_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "LATTICE_TEST_TMPDIR=$WRAPPER_JOB_ROOT/tmp"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$WRAPPER_JOB_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$WRAPPER_JOB_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$WRAPPER_JOB_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$WRAPPER_JOB_ROOT/test-logs/swift-tests.log"
            echo "LATTICE_PERF_TEST_LOG_PATH=$WRAPPER_JOB_ROOT/test-logs/swift-perf-tests.log"
            if [ "$(uname -s)" = Linux ]; then
              echo "XDG_RUNTIME_DIR=$WRAPPER_JOB_ROOT/runtime"
            fi
          } >> "$GITHUB_ENV"
          git init "$WRAPPER_JOB_ROOT/source"
          git -C "$WRAPPER_JOB_ROOT/source" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$WRAPPER_JOB_ROOT/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$WRAPPER_JOB_ROOT/source" rev-parse HEAD)" = "$GITHUB_SHA"

      - &consumer_metadata
        name: Capture strict consumer source and toolchain metadata
        id: consumer_metadata
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: |
          set -eu
          CONSUMER_DIR="$WRAPPER_JOB_ROOT/consumer"
          mkdir -p "$CONSUMER_DIR"
          cat > "$CONSUMER_DIR/capture-command.sh" <<'CAPTURE'
          #!/usr/bin/env bash
          # Capture exact stdout/stderr/status, returning the original command status.
          capture_command() {
            local name="$1"
            shift
            local status=0
            printf '%s\0' "$@" > "$CONSUMER_DIR/$name.argv.nul"
            if "$@" > "$CONSUMER_DIR/$name.stdout" 2> "$CONSUMER_DIR/$name.stderr"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" > "$CONSUMER_DIR/$name.exit-code"
            return "$status"
          }
          CAPTURE
          source "$CONSUMER_DIR/capture-command.sh"
          status=0
          capture_command checkout-sha git -c safe.directory="$WRAPPER_JOB_ROOT/source" rev-parse HEAD || status=$?
          capture_command checkout-tree git -c safe.directory="$WRAPPER_JOB_ROOT/source" rev-parse 'HEAD^{tree}' || status=$?
          capture_command checkout-status git -c safe.directory="$WRAPPER_JOB_ROOT/source" status --porcelain || status=$?
          capture_command host uname -a || status=$?
          capture_command swift-path command -v swift || status=$?
          capture_command swift-version swift --version || status=$?
          capture_command build-help swift build --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --help || status=$?
          capture_command test-help swift test --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --help || status=$?
          capture_command resolve-help swift package --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" resolve --help || status=$?
          if [ "$(uname -s)" = "Darwin" ]; then
            capture_command developer-path xcode-select -p || status=$?
            capture_command xcode-version xcodebuild -version || status=$?
            capture_command xcrun-swift-path xcrun --find swift || status=$?
            capture_command macos-sdk-path xcrun --sdk macosx --show-sdk-path || status=$?
            capture_command macos-sdk-version xcrun --sdk macosx --show-sdk-version || status=$?
            capture_command ios-simulator-sdk-path xcrun --sdk iphonesimulator --show-sdk-path || status=$?
            capture_command ios-simulator-sdk-version xcrun --sdk iphonesimulator --show-sdk-version || status=$?
            capture_command xcodebuild-help xcodebuild -help || status=$?
          fi
          printf '%s\n' 'STRICT CONSUMER: committed lock integrity and upstream pin checks do not establish final graph acceptance.' > "$CONSUMER_DIR/QUALIFICATION.txt"
          exit "$status"

      - &strict_baseline
        name: Authenticate complete committed lock and source baseline
        id: strict_baseline
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase baseline --evidence-dir "$WRAPPER_JOB_ROOT/consumer"

      - &binding_check
        name: Verify qualified upstream Core and SDK bindings
        id: binding_check
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: |
          python3 -B Scripts/test-wrapper-bindings.py
          python3 Scripts/verify-wrapper-bindings.py \
            --expected Scripts/wrapper-expected-bindings.json \
            --resolved "$WRAPPER_JOB_ROOT/consumer/baseline/files/Package.resolved"

      - &before_build
        name: Verify full lock integrity before build
        id: before_build
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase before-build --evidence-dir "$WRAPPER_JOB_ROOT/consumer"

      - name: Build
        id: build
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: swift build --build-tests --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --force-resolved-versions

      - &after_build
        name: Capture and verify complete lock integrity after build
        id: after_build
        if: always()
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase after-build --evidence-dir "$WRAPPER_JOB_ROOT/consumer"

      - &before_test
        name: Verify full lock integrity before test
        id: before_test
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase before-test --evidence-dir "$WRAPPER_JOB_ROOT/consumer"

      - name: Record Linux observation resource limits
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'max_user_instances='; cat /proc/sys/fs/inotify/max_user_instances
            printf 'max_user_watches='; cat /proc/sys/fs/inotify/max_user_watches
            printf 'ulimit_n='; ulimit -n
          } | tee "$WRAPPER_JOB_ROOT/consumer/linux-observation-limits.txt"

      - name: Cross-Process Observation Tests alone, 20 fresh processes
        id: test
        shell: bash
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: '1'
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: |
          set -euo pipefail
          control="$WRAPPER_JOB_ROOT/consumer/linux-observation-control"
          mkdir -p "$control"
          printf 'iteration\texit_code\n' > "$control/results.tsv"
          for iteration in $(seq 1 20); do
            printf -v label '%02d' "$iteration"
            receipt="$control/run-$label"
            mkdir -p "$receipt"
            export LATTICE_TEST_LOG_PATH="$WRAPPER_JOB_ROOT/test-logs/observation-$label.log"
            export LATTICE_PERF_TEST_LOG_PATH="$WRAPPER_JOB_ROOT/test-logs/observation-perf-$label.log"
            echo "[observation-isolation] run=$label start"
            status=0
            python3 Scripts/linux-suite-watchdog.py --evidence "$receipt/watchdog" \
              --timeout-seconds 900 -- swift test \
              --scratch-path "$WRAPPER_JOB_ROOT/source/.build" \
              --cache-path "$WRAPPER_JOB_ROOT/swift-cache" \
              --config-path "$WRAPPER_JOB_ROOT/swift-config" \
              --security-path "$WRAPPER_JOB_ROOT/swift-security" \
              --force-resolved-versions --skip-build \
              --filter '^LatticeTests[.]CrossProcessTests(/|$)' \
              > "$receipt/stdout.log" 2> "$receipt/stderr.log" || status=$?
            cat "$receipt/stdout.log" "$receipt/stderr.log"
            if [ "$status" -eq 0 ]; then
              python3 - "$receipt" <<'CHECK' || status=$?
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = (path / "stdout.log").read_text() + (path / "stderr.log").read_text()
          assert 'Suite "Cross-Process Observation Tests" passed' in text, text
          assert re.search(r'Test run with 9 tests in 1 suite passed', text), text
          assert not re.search(r'\bskipped\b', text, re.I), "Selected tests skipped"
          CHECK
            fi
            printf '%s\t%s\n' "$label" "$status" >> "$control/results.tsv"
            echo "[observation-isolation] run=$label end exit=$status"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done

      - &after_test
        name: Capture and verify complete lock integrity after test
        id: after_test
        if: always()
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase after-test --evidence-dir "$WRAPPER_JOB_ROOT/consumer"

      - &consumer_finalize
        name: Capture final complete lock integrity and step outcomes
        id: consumer_finalize
        if: always()
        shell: bash
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: |
          set -eu
          CONSUMER_DIR="$WRAPPER_JOB_ROOT/consumer"
          mkdir -p "$CONSUMER_DIR"
          printf '%s\n' "$CONSUMER_STEP_OUTCOMES" > "$CONSUMER_DIR/step-outcomes.json"
          python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$WRAPPER_JOB_ROOT/source" --phase final --evidence-dir "$CONSUMER_DIR"

      - &consumer_upload
        name: Retain strict consumer evidence (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-strict-consumer-${{ env.CONSUMER_LEG }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.WRAPPER_JOB_ROOT }}/consumer
            ${{ env.WRAPPER_JOB_ROOT }}/test-logs
            ${{ env.WRAPPER_JOB_ROOT }}/tmp/*.log
          include-hidden-files: true
          if-no-files-found: error

  # Build-only: proves the library product compiles for iOS (the platform we
  # declare but never test on — tests need a host app). The `Lattice` scheme
  # is Xcode's auto-generated package scheme; nothing under .swiftpm/ is
  # committed. -skipMacroValidation is MANDATORY: Lattice depends on a .macro
  # target and xcodebuild refuses to run unvalidated macros non-interactively.
  ios-build:
    if: ${{ false }} # The temporary control executes only Linux 6.3.
    env:
      CONSUMER_LEG: ios-xcode
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - *wrapper_checkout

      - *consumer_metadata
      - *strict_baseline
      - *binding_check
      - *before_build

      # ARCHS=arm64: the x86_64 simulator slice trips an upstream LatticeCore
      # bug (SqliteVec's dependency scan pulls _Builtin_intrinsics.arm.neon,
      # "requires feature 'neon'", on x86_64). Rosetta-simulator is legacy;
      # arm64 is the slice that matters. Drop the override when LatticeCore
      # fixes the include.
      - name: Build (iOS Simulator)
        id: build
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: xcodebuild -scheme Lattice -destination 'generic/platform=iOS Simulator' build -skipMacroValidation -onlyUsePackageVersionsFromResolvedFile -derivedDataPath "$WRAPPER_JOB_ROOT/derived-data" -clonedSourcePackagesDirPath "$WRAPPER_JOB_ROOT/source-packages" CLANG_MODULE_CACHE_PATH="$WRAPPER_JOB_ROOT/module-cache" ARCHS=arm64

      - *after_build

      - *consumer_finalize
      - *consumer_upload

  macos:
    if: ${{ false }} # The temporary control executes only Linux 6.3.
    env:
      CONSUMER_LEG: macos-swiftpm
    runs-on: macos-26
    # Known intermittent relay-test hang (1.0 item D) — fail fast, re-run.
    timeout-minutes: 30
    steps:
      - *wrapper_checkout

      - *consumer_metadata
      - *strict_baseline
      - *binding_check
      - *before_build

      - name: Build
        id: build
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: swift build --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --force-resolved-versions

      - *after_build
      - *before_test

      # ACK-path diagnostics run within the unchanged full native suite.
      - name: Test
        id: test
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: '1'
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        # Ten timing-sensitive methods (twelve cases) run once with their original deadlines.
        run: |
          echo "[lattice-test-partition] ordinary start"
          ordinary_status=0
          swift test --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --force-resolved-versions --skip "^LatticeTests[.]AsyncLocalOpenTests(/|$)|^LatticeTests[.]ServerRelayTests/initialCatchUpPageSizePreservesHistoryAndResume([(]|$)" || ordinary_status=$?
          echo "[lattice-test-partition] ordinary end exit=$ordinary_status"
          echo "[lattice-test-partition] timing-sensitive start"
          async_status=0
          swift test --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --force-resolved-versions --skip-build --no-parallel --filter "^LatticeTests[.]AsyncLocalOpenTests(/|$)|^LatticeTests[.]ServerRelayTests/initialCatchUpPageSizePreservesHistoryAndResume([(]|$)" || async_status=$?
          echo "[lattice-test-partition] timing-sensitive end exit=$async_status"
          status=$ordinary_status
          if [ "$async_status" -ne 0 ]; then status=$async_status; fi
          exit "$status"

      # Native sync may block while waiting for cancellation. One cooperative
      # worker makes accidental Task.detached blocking reproducibly fail.
      - name: Background sync with one cooperative worker
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        working-directory: ${{ env.WRAPPER_JOB_ROOT }}/source
        run: swift test --skip-build --scratch-path "$WRAPPER_JOB_ROOT/source/.build" --cache-path "$WRAPPER_JOB_ROOT/swift-cache" --config-path "$WRAPPER_JOB_ROOT/swift-config" --security-path "$WRAPPER_JOB_ROOT/swift-security" --force-resolved-versions --filter 'BackgroundSyncBindingTests|FiniteSyncIntegrationTests'

      - *after_test
      - *consumer_finalize
      - *consumer_upload
