name: CI

# Strict consumer verifies committed dependency bindings and complete lock integrity.
# Build and test outcomes remain independent qualification gates.

# Single source of truth for the test gates. `release.yml` calls this
# workflow (workflow_call) instead of copy-pasting the jobs, so the gates
# cannot drift between the push/PR path and the release path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  linux:
    name: linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A known intermittent relay-test hang (pre-existing, tracked for 1.0
    # item D) can wedge a run; fail fast and re-run instead of a 6h zombie.
    timeout-minutes: 90
    strategy:
      # Never let an informational nightly failure cancel the release-gating
      # stable leg.
      fail-fast: false
      matrix:
        include:
          # Must be >= the manifest's swift-tools-version (6.3): a 6.2
          # toolchain refuses the manifest at parse time, before any compile
          # error can surface.
          - image: swift:6.3-noble
            experimental: false
            consumerLeg: linux-stable
          # Early warning against the next toolchain. Informational only
          # (continue-on-error). Nightly images live under the swiftlang/
          # Docker org — `swift:nightly-*` does NOT exist.
          - image: swiftlang/swift:nightly-main-noble
            experimental: true
            consumerLeg: linux-nightly
    # Marks the job green even when the nightly leg fails; the stable leg
    # still gates.
    continue-on-error: ${{ matrix.experimental }}
    container: ${{ matrix.image }}
    env:
      CONSUMER_LEG: ${{ matrix.consumerLeg }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev sqlite3

      - name: Install consumer evidence tooling
        run: apt-get install -y python3

      - &consumer_metadata
        name: Capture strict consumer source and toolchain metadata
        id: consumer_metadata
        shell: bash
        run: |
          set -eu
          CONSUMER_DIR="$RUNNER_TEMP/wrapper-strict-consumer"
          mkdir -p "$CONSUMER_DIR"
          cat > "$CONSUMER_DIR/capture-command.sh" <<'CAPTURE'
          #!/usr/bin/env bash
          # Capture exact stdout/stderr/status, returning the original command status.
          capture_command() {
            local name="$1"
            shift
            local status=0
            printf '%s\0' "$@" > "$CONSUMER_DIR/$name.argv.nul"
            if "$@" > "$CONSUMER_DIR/$name.stdout" 2> "$CONSUMER_DIR/$name.stderr"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" > "$CONSUMER_DIR/$name.exit-code"
            return "$status"
          }
          CAPTURE
          source "$CONSUMER_DIR/capture-command.sh"
          status=0
          capture_command checkout-sha git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD || status=$?
          capture_command checkout-tree git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}' || status=$?
          capture_command checkout-status git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain || status=$?
          capture_command host uname -a || status=$?
          capture_command swift-path command -v swift || status=$?
          capture_command swift-version swift --version || status=$?
          capture_command build-help swift build --help || status=$?
          capture_command test-help swift test --help || status=$?
          capture_command resolve-help swift package resolve --help || status=$?
          if [ "$(uname -s)" = "Darwin" ]; then
            capture_command developer-path xcode-select -p || status=$?
            capture_command xcode-version xcodebuild -version || status=$?
            capture_command xcrun-swift-path xcrun --find swift || status=$?
            capture_command macos-sdk-path xcrun --sdk macosx --show-sdk-path || status=$?
            capture_command macos-sdk-version xcrun --sdk macosx --show-sdk-version || status=$?
            capture_command ios-simulator-sdk-path xcrun --sdk iphonesimulator --show-sdk-path || status=$?
            capture_command ios-simulator-sdk-version xcrun --sdk iphonesimulator --show-sdk-version || status=$?
            capture_command xcodebuild-help xcodebuild -help || status=$?
          fi
          printf '%s\n' 'STRICT CONSUMER: committed lock integrity and upstream pin checks do not establish final graph acceptance.' > "$CONSUMER_DIR/QUALIFICATION.txt"
          exit "$status"

      - &strict_baseline
        name: Authenticate complete committed lock and source baseline
        id: strict_baseline
        shell: bash
        run: python3 Scripts/verify-wrapper-lock-integrity.py --phase baseline --evidence-dir "$RUNNER_TEMP/wrapper-strict-consumer"

      - &binding_check
        name: Verify qualified upstream Core and SDK bindings
        id: binding_check
        shell: bash
        run: |
          python3 Scripts/verify-wrapper-bindings.py \
            --expected Scripts/wrapper-expected-bindings.json \
            --resolved "$RUNNER_TEMP/wrapper-strict-consumer/baseline/files/Package.resolved"

      - &before_build
        name: Verify full lock integrity before build
        id: before_build
        shell: bash
        run: python3 Scripts/verify-wrapper-lock-integrity.py --phase before-build --evidence-dir "$RUNNER_TEMP/wrapper-strict-consumer"

      - name: Build
        id: build
        run: swift build --force-resolved-versions

      - &after_build
        name: Capture and verify complete lock integrity after build
        id: after_build
        if: always()
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        run: python3 Scripts/verify-wrapper-lock-integrity.py --phase after-build --evidence-dir "$RUNNER_TEMP/wrapper-strict-consumer"

      - &before_test
        name: Verify full lock integrity before test
        id: before_test
        shell: bash
        run: python3 Scripts/verify-wrapper-lock-integrity.py --phase before-test --evidence-dir "$RUNNER_TEMP/wrapper-strict-consumer"

      - name: Test
        id: test
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: ${{ matrix.consumerLeg == 'linux-stable' && '1' || '0' }}
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: ${{ matrix.consumerLeg == 'linux-stable' && '1' || '0' }}
        run: swift test --force-resolved-versions

      - &after_test
        name: Capture and verify complete lock integrity after test
        id: after_test
        if: always()
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        run: python3 Scripts/verify-wrapper-lock-integrity.py --phase after-test --evidence-dir "$RUNNER_TEMP/wrapper-strict-consumer"

      - &consumer_finalize
        name: Capture final complete lock integrity and step outcomes
        id: consumer_finalize
        if: always()
        shell: bash
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -eu
          CONSUMER_DIR="$RUNNER_TEMP/wrapper-strict-consumer"
          mkdir -p "$CONSUMER_DIR"
          printf '%s\n' "$CONSUMER_STEP_OUTCOMES" > "$CONSUMER_DIR/step-outcomes.json"
          python3 Scripts/verify-wrapper-lock-integrity.py --phase final --evidence-dir "$CONSUMER_DIR"

      - &consumer_upload
        name: Retain strict consumer evidence (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-strict-consumer-${{ env.CONSUMER_LEG }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrapper-strict-consumer
          include-hidden-files: true
          if-no-files-found: error

  # Build-only: proves the library product compiles for iOS (the platform we
  # declare but never test on — tests need a host app). The `Lattice` scheme
  # is Xcode's auto-generated package scheme; nothing under .swiftpm/ is
  # committed. -skipMacroValidation is MANDATORY: Lattice depends on a .macro
  # target and xcodebuild refuses to run unvalidated macros non-interactively.
  ios-build:
    env:
      CONSUMER_LEG: ios-xcode
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - *consumer_metadata
      - *strict_baseline
      - *binding_check
      - *before_build

      # ARCHS=arm64: the x86_64 simulator slice trips an upstream LatticeCore
      # bug (SqliteVec's dependency scan pulls _Builtin_intrinsics.arm.neon,
      # "requires feature 'neon'", on x86_64). Rosetta-simulator is legacy;
      # arm64 is the slice that matters. Drop the override when LatticeCore
      # fixes the include.
      - name: Build (iOS Simulator)
        id: build
        run: xcodebuild -scheme Lattice -destination 'generic/platform=iOS Simulator' build -skipMacroValidation -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64

      - *after_build

      - *consumer_finalize
      - *consumer_upload

  macos:
    env:
      CONSUMER_LEG: macos-swiftpm
    runs-on: macos-26
    # Known intermittent relay-test hang (1.0 item D) — fail fast, re-run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - *consumer_metadata
      - *strict_baseline
      - *binding_check
      - *before_build

      - name: Build
        id: build
        run: swift build --force-resolved-versions

      - *after_build
      - *before_test

      # ACK-path diagnostics run within the unchanged full native suite.
      - name: Test
        id: test
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: '1'
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
        run: swift test --force-resolved-versions

      - *after_test
      - *consumer_finalize
      - *consumer_upload
