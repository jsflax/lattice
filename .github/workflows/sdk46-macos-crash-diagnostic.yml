name: SDK46 macOS controlled crash capture diagnostic
on:
  push:
    branches: [codex/perf-qualification-20260918]
    paths: ['.github/workflows/sdk46-macos-crash-diagnostic.yml', 'Scripts/sdk46-macos-crash-diagnostic/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-diagnostic:
    runs-on: macos-26
    timeout-minutes: 235
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SEAL_SHA256: 74fadb174eacdaec6689d3dc9f0006a5dfa539582d51f35d4cc6d6c9cf37fc9a
    steps:
      - name: Fetch exact diagnostic tools under localdev
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/sdk46-macos-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TASK_ROOT
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          echo "TASK_ROOT=$TASK_ROOT" >> "$GITHUB_ENV"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ['TASK_ROOT'])
          record = {k: os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'SOURCE_SEAL_SHA256')}
          (root / 'workflow-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Prove capture then fresh Debug graph and two diagnostic arms
        timeout-minutes: 212
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          python3 -B "$TASK_ROOT/tools/Scripts/sdk46-macos-crash-diagnostic/qualify.py" \
            --root "$TASK_ROOT/diagnostic" \
            --source-seal-sha256 "$SOURCE_SEAL_SHA256"
      - name: Preserve control, command, source, stack and failure evidence
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: sdk46-macos-crash-diagnostic-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/workflow-source.json
            ${{ env.TASK_ROOT }}/diagnostic/receipts
            ${{ env.TASK_ROOT }}/diagnostic/test-logs
            ${{ env.TASK_ROOT }}/diagnostic/control/CrashControl.swift
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
