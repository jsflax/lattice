name: Core2.0.6 full and focused failure diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-diagnostic:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPMENT_LEG: linux
    steps:
      - name: Install Linux prerequisites
        timeout-minutes: 10
        run: apt-get update && apt-get install -y git python3 libsqlite3-dev sqlite3
      - name: Fetch exact diagnostic tools into owned localdev root
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          TASK_ROOT="$HOME/localdev/lattice-core206-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$TASK_ROOT"
          mkdir -p "$TASK_ROOT/tmp"
          export TMPDIR="$TASK_ROOT/tmp" TMP="$TASK_ROOT/tmp" TEMP="$TASK_ROOT/tmp"
          {
            echo "TASK_ROOT=$TASK_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
          } >> "$GITHUB_ENV"
          git init "$TASK_ROOT/tools"
          git -C "$TASK_ROOT/tools" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$TASK_ROOT/tools" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TASK_ROOT/tools" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$TASK_ROOT/tools" status --porcelain=v1 --untracked-files=all)"
          mkdir "$TASK_ROOT/qualification-inputs"
          cp -R "$TASK_ROOT/tools/Scripts/core206-failure-diagnostic/." "$TASK_ROOT/qualification-inputs/"
          cp "$TASK_ROOT/tools/.github/workflows/development.yml" "$TASK_ROOT/qualification-inputs/installed-workflow.yml"
          git -C "$TASK_ROOT/tools" show --no-patch --format='%H %T' HEAD > "$TASK_ROOT/qualification-inputs/workflow-source.txt"
      - name: Test exact candidate full then focused on the same binary
        timeout-minutes: 215
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$TASK_ROOT/run"
          python3 -B "$TASK_ROOT/tools/Scripts/core206-failure-diagnostic/run-diagnostic.py" \
            --root "$TASK_ROOT/run" --aggregate-root "$TASK_ROOT" --test-timeout 5400 \
            --binding "$TASK_ROOT/tools/Scripts/core206-failure-diagnostic/binding.json"
      - name: Retain both invocations and first failures
        if: always() && env.TASK_ROOT != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: core206-failure-diagnostic-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_ROOT }}/run/receipts
            ${{ env.TASK_ROOT }}/run/test-logs
            ${{ env.TASK_ROOT }}/qualification-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
