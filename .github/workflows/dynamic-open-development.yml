name: Dynamic open development qualification

# Candidate qualification only. Published release bindings and ordinary CI stay
# unchanged; this workflow neither labels the draft Core as released nor publishes.
on:
  pull_request:
    branches: [codex/hud-int64-audit-wire]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: Full SDK development (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux
            runner: ubuntu-latest
            container: swift:6.3-noble
            timeout: 90
          - leg: macos
            runner: macos-26
            container: null
            timeout: 30
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      DEVELOPMENT_LEG: ${{ matrix.leg }}
      CORE_SHA: 8ea970a6fd21eeb5f70561bf12ccc1f69cafa5fd
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install Linux prerequisites
        id: linux_prerequisites
        if: matrix.leg == 'linux'
        run: apt-get update && apt-get install -y git python3 gdb libsqlite3-dev sqlite3

      - name: Fetch exact candidate into owned localdev directory
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_REPOSITORY" = jsflax/lattice
          DEVELOPMENT_ROOT="$HOME/localdev/ld-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEVELOPMENT_LEG}"
          test ! -e "$DEVELOPMENT_ROOT"
          mkdir -p "$DEVELOPMENT_ROOT"/{tmp,swift-cache,swift-config,swift-security,module-cache,test-logs,consumer,runtime}
          chmod 700 "$DEVELOPMENT_ROOT/runtime"
          export TMPDIR="$DEVELOPMENT_ROOT/tmp" TMP="$DEVELOPMENT_ROOT/tmp" TEMP="$DEVELOPMENT_ROOT/tmp"
          {
            echo "DEVELOPMENT_ROOT=$DEVELOPMENT_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "LATTICE_TMPDIR=$TMPDIR"
            echo "LATTICE_TEST_TMPDIR=$TMPDIR"
            echo "CLANG_MODULE_CACHE_PATH=$DEVELOPMENT_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$DEVELOPMENT_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$DEVELOPMENT_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$DEVELOPMENT_ROOT/test-logs/swift-tests.log"
            echo "LATTICE_PERF_TEST_LOG_PATH=$DEVELOPMENT_ROOT/test-logs/swift-perf-tests.log"
            if [ "$(uname -s)" = Linux ]; then
              echo "XDG_RUNTIME_DIR=$DEVELOPMENT_ROOT/runtime"
            fi
          } >> "$GITHUB_ENV"
          git init "$DEVELOPMENT_ROOT/source"
          git -C "$DEVELOPMENT_ROOT/source" fetch --depth=1 "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_SHA"
          git -C "$DEVELOPMENT_ROOT/source" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$DEVELOPMENT_ROOT/source" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Bind the development graph and capture source metadata
        id: development_binding
        shell: bash
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$DEVELOPMENT_ROOT/consumer/checkout-sha.stdout"
          git rev-parse 'HEAD^{tree}' > "$DEVELOPMENT_ROOT/consumer/checkout-tree.stdout"
          git status --porcelain > "$DEVELOPMENT_ROOT/consumer/checkout-status.stdout"
          test ! -s "$DEVELOPMENT_ROOT/consumer/checkout-status.stdout"
          swift --version > "$DEVELOPMENT_ROOT/consumer/swift-version.stdout" 2>&1
          uname -a > "$DEVELOPMENT_ROOT/consumer/host.stdout"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = {
              'Package.swift': '5484c5ef67acd961ffffce3e0bc204b14ff3fe8e913bd0b4d6b2d681c287cd95',
              'Package.resolved': '5269a3cdd54b573216d1d73e918156d8b1b5208566751586da0853d8e1e53b2c',
              'Scripts/wrapper-expected-bindings.json': '46308d4346fce0996bde3603948fd5b0530b02f37c8fd89c9e5ecb502220a926',
          }
          actual = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in expected}
          assert actual == expected, 'Candidate dependency graph or release expectations changed'
          lock = json.loads(Path('Package.resolved').read_text())
          assert len(lock['pins']) == len({pin['identity'] for pin in lock['pins']}) == 34
          core = [pin for pin in lock['pins'] if pin['identity'] == 'latticecore']
          assert core == [{'identity': 'latticecore', 'kind': 'remoteSourceControl',
              'location': 'https://github.com/jsflax/LatticeCore.git',
              'state': {'revision': os.environ['CORE_SHA']}}]
          evidence = {'scope': 'Unreleased exact-Core development graph; not release qualification',
              'sourceSHA': os.environ['SOURCE_SHA'], 'coreSHA': os.environ['CORE_SHA'],
              'files': actual, 'pinCount': 34, 'releaseBindingsUnchanged': True}
          (Path(os.environ['DEVELOPMENT_ROOT'])/'consumer/development-binding.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
          cp .github/workflows/dynamic-open-development.yml "$DEVELOPMENT_ROOT/consumer/workflow.yml"
          python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase baseline --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Verify full lock integrity before build
        id: before_build
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase before-build --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Build the complete SDK package
        id: build
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: swift build --scratch-path "$DEVELOPMENT_ROOT/source/.build" --cache-path "$DEVELOPMENT_ROOT/swift-cache" --config-path "$DEVELOPMENT_ROOT/swift-config" --security-path "$DEVELOPMENT_ROOT/swift-security" --force-resolved-versions

      - name: Capture full lock integrity after build
        id: after_build
        if: always() && env.DEVELOPMENT_ROOT != ''
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase after-build --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Verify the actual Core checkout
        id: core_checkout
        shell: bash
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          scratch = Path(os.environ['DEVELOPMENT_ROOT'])/'source/.build'
          workspace = json.loads((scratch/'workspace-state.json').read_text())
          entries = [entry for entry in workspace['object']['dependencies'] if entry['packageRef']['identity'] == 'latticecore']
          assert len(entries) == 1
          entry = entries[0]
          assert entry['packageRef']['kind'] == 'remoteSourceControl'
          assert entry['state']['checkoutState']['revision'] == os.environ['CORE_SHA']
          checkout = (scratch/'checkouts'/entry['subpath']).resolve(strict=True)
          assert checkout.is_relative_to((scratch/'checkouts').resolve(strict=True))
          actual = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          assert actual == os.environ['CORE_SHA']
          assert not subprocess.check_output(['git', '-C', str(checkout), 'status', '--porcelain'], text=True, timeout=15).strip()
          (Path(os.environ['DEVELOPMENT_ROOT'])/'consumer/core-checkout.json').write_text(json.dumps({'path': str(checkout), 'revision': actual}, indent=2)+'\n')
          PY

      - name: Verify full lock integrity before tests
        id: before_test
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase before-test --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Check the existing Linux watchdog fixtures
        id: watchdog_fixtures
        if: matrix.leg == 'linux'
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: LATTICE_WATCHDOG_FIXTURE_ROOT="$DEVELOPMENT_ROOT/tmp/watchdog-fixtures" python3 -B Scripts/test-linux-suite-watchdog.py -v

      - name: Run the full Linux SDK suite
        id: linux_test
        if: matrix.leg == 'linux'
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: '1'
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: >-
          python3 Scripts/linux-suite-watchdog.py --evidence "$DEVELOPMENT_ROOT/consumer/linux-suite-watchdog"
          --timeout-seconds 900 --
          swift test --scratch-path "$DEVELOPMENT_ROOT/source/.build" --cache-path "$DEVELOPMENT_ROOT/swift-cache" --config-path "$DEVELOPMENT_ROOT/swift-config" --security-path "$DEVELOPMENT_ROOT/swift-security" --force-resolved-versions

      - name: Run the full macOS SDK suite
        id: macos_test
        if: matrix.leg == 'macos'
        env:
          LATTICE_ACK_PATH_DIAGNOSTICS: '1'
          LATTICE_OBSERVER_WORKER_DIAGNOSTICS: '1'
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: swift test --scratch-path "$DEVELOPMENT_ROOT/source/.build" --cache-path "$DEVELOPMENT_ROOT/swift-cache" --config-path "$DEVELOPMENT_ROOT/swift-config" --security-path "$DEVELOPMENT_ROOT/swift-security" --force-resolved-versions

      - name: Capture full lock integrity after tests
        id: after_test
        if: always() && env.DEVELOPMENT_ROOT != ''
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase after-test --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Capture final identity and outcomes
        id: final_integrity
        if: always() && env.DEVELOPMENT_ROOT != ''
        env:
          CONSUMER_STEP_OUTCOMES: ${{ toJSON(steps) }}
        shell: bash
        working-directory: ${{ env.DEVELOPMENT_ROOT }}/source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$CONSUMER_STEP_OUTCOMES" > "$DEVELOPMENT_ROOT/consumer/step-outcomes.json"
          python3 Scripts/verify-wrapper-lock-integrity.py --workspace "$DEVELOPMENT_ROOT/source" --phase final --evidence-dir "$DEVELOPMENT_ROOT/consumer"

      - name: Retain candidate evidence including failures
        id: evidence
        if: always() && env.DEVELOPMENT_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-open-development-${{ matrix.leg }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.DEVELOPMENT_ROOT }}/consumer
            ${{ env.DEVELOPMENT_ROOT }}/test-logs
          include-hidden-files: true
          if-no-files-found: error
